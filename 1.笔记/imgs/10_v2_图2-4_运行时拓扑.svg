<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 408" width="680" height="408">
<rect x="0" y="0" width="680" height="408" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">运行时拓扑</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="24" y="60" width="118" height="64" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="32" y="67" width="102" height="50" rx="6" fill="#FFFFFF"/><text x="44" y="89.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">接口层</text><text x="44" y="106.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">创建任务与运行</text><path d="M 142 92 L 148 92" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="154,92 147,88 147,96" fill="#7A94AD"/><rect x="154" y="60" width="118" height="64" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/><rect x="162" y="67" width="102" height="50" rx="6" fill="#FFFFFF"/><text x="174" y="89.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">消息中间件</text><text x="174" y="106.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">三类队列</text><path d="M 272 92 L 278 92" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="284,92 277,88 277,96" fill="#7A94AD"/><rect x="284" y="60" width="118" height="64" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="292" y="67" width="102" height="50" rx="6" fill="#FFFFFF"/><text x="304" y="89.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">后台 Worker</text><text x="304" y="106.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">认领租约并执行</text><path d="M 402 92 L 408 92" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="414,92 407,88 407,96" fill="#7A94AD"/><rect x="414" y="60" width="118" height="64" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/><rect x="422" y="67" width="102" height="50" rx="6" fill="#FFFFFF"/><text x="434" y="89.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">工具网关</text><text x="434" y="106.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">租约·幂等·复核</text><path d="M 532 92 L 538 92" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="544,92 537,88 537,96" fill="#7A94AD"/><rect x="544" y="60" width="118" height="64" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/><rect x="552" y="67" width="102" height="50" rx="6" fill="#FFFFFF"/><text x="564" y="89.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">业务服务</text><text x="564" y="106.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">已有能力原样调用</text><text x="24" y="140" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">运行 / 工作流 / 维护三类队列耗时特征不同，混一条会互相阻塞</text><rect x="300" y="156" width="300" height="46" rx="8" fill="#F2F5F8" stroke="#C9D6E5" stroke-width="1"/><text x="320" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">维护与周期任务：投递待发消息 · 回收到期与超时运行</text><path d="M 420 156 L 420 126" fill="none" stroke="#7A94AD" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 600 156 L 600 190" fill="none" stroke="#7A94AD" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="24" y="224" width="300" height="118" rx="8" fill="#E6F1FB" stroke="#9CC3E5" stroke-width="1"/><rect x="32" y="231" width="284" height="104" rx="6" fill="#FFFFFF"/><text x="44" y="280.0" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">业务数据库</text><text x="44" y="297.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">任务 · 运行 · 事件 · 操作 · 审批 · 产物</text><text x="40" y="300" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start" font-weight="700">使用者可见的业务事实</text><text x="40" y="320" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">用于审计，不能只存在于内存</text><rect x="356" y="224" width="300" height="118" rx="8" fill="#EEEDFE" stroke="#C5C3EC" stroke-width="1"/><rect x="364" y="231" width="284" height="104" rx="6" fill="#FFFFFF"/><text x="376" y="280.0" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">检查点数据库</text><text x="376" y="297.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">图的中间状态，按线程标识保存</text><text x="372" y="300" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#6D5FB5" text-anchor="start" font-weight="700">只用于技术恢复</text><text x="372" y="320" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">不能替代业务库做审计</text><path d="M 174 202 L 174 222" fill="none" stroke="#7A94AD" stroke-width="1.5"/><path d="M 506 202 L 506 222" fill="none" stroke="#7A94AD" stroke-width="1.5"/><rect x="24" y="356" width="632" height="42" rx="6" fill="#FAECE7" stroke="#E7B9AB" stroke-width="1"/><text x="340" y="374" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="700">两条写入线彼此独立，缺一不可</text><text x="340" y="391" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="middle">只写业务库：中断后无法从断点续跑　|　只写检查点：事后无法审计</text>
</svg>
