<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="780" height="540" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2d3d">Agent 任务治理关系</text>
  <text x="24" y="54" font-size="12" fill="#2b6cb0">Task 表达用户目标，Run 是某次执行实例；审批、事件、操作、记忆都围绕 Run 与 Workspace 展开</text>

  <!-- Task -->
  <rect x="290" y="78" width="200" height="54" rx="10" fill="#E6F1FB" stroke="#2b6cb0" stroke-width="2"/>
  <text x="390" y="104" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">AgentTask</text>
  <text x="390" y="122" font-size="11" fill="#2b6cb0" text-anchor="middle">用户业务目标</text>

  <!-- Run -->
  <rect x="290" y="178" width="200" height="54" rx="10" fill="#E6F1FB" stroke="#9cc2e6"/>
  <text x="390" y="204" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">AgentRun</text>
  <text x="390" y="222" font-size="11" fill="#2b6cb0" text-anchor="middle">执行实例（Task 1—* Run）</text>

  <!-- Task -> Run -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M 390 132 L 390 176" fill="none"/>
  </g>
  <polygon points="390,176 384,168 396,168" fill="#94a3b8"/>

  <!-- Review 右 -->
  <rect x="540" y="160" width="220" height="64" rx="8" fill="#EEEDFE" stroke="#b3abec"/>
  <text x="554" y="184" font-size="12" font-weight="700" fill="#1f2d3d">AgentRunReview</text>
  <text x="554" y="204" font-size="11" fill="#334155">运行审核（Run 1—1）</text>
  <text x="554" y="222" font-size="11" fill="#2b6cb0">approve / edit_and_approve</text>

  <!-- Event 右下 -->
  <rect x="540" y="244" width="220" height="58" rx="8" fill="#EEEDFE" stroke="#b3abec"/>
  <text x="554" y="268" font-size="12" font-weight="700" fill="#1f2d3d">AgentRunEvent</text>
  <text x="554" y="288" font-size="11" fill="#334155">进度/轨迹事件（Run 1—*）</text>

  <!-- Operation 左下 -->
  <rect x="20" y="244" width="220" height="58" rx="8" fill="#EEEDFE" stroke="#b3abec"/>
  <text x="34" y="268" font-size="12" font-weight="700" fill="#1f2d3d">AgentRunOperation</text>
  <text x="34" y="288" font-size="11" fill="#334155">幂等副作用（Run 1—*）</text>

  <!-- Approval 下 -->
  <rect x="290" y="268" width="200" height="64" rx="8" fill="#FAECE7" stroke="#e0a99a"/>
  <text x="304" y="292" font-size="12" font-weight="700" fill="#1f2d3d">AgentApproval</text>
  <text x="304" y="312" font-size="11" fill="#334155">审批闸门（task+run）</text>
  <text x="304" y="330" font-size="11" fill="#2b6cb0">R0–R3 风险分级</text>

  <!-- Conversation + Message 左下角 -->
  <rect x="20" y="344" width="220" height="76" rx="8" fill="#EAF3DE" stroke="#a9cf8a"/>
  <text x="34" y="368" font-size="12" font-weight="700" fill="#1f2d3d">AgentConversation</text>
  <text x="34" y="388" font-size="11" fill="#334155">AgentConversationMessage</text>
  <text x="34" y="406" font-size="11" fill="#2b6cb0">对话与消息（1—*）</text>

  <!-- Memory 右下角 -->
  <rect x="540" y="336" width="220" height="64" rx="8" fill="#FAEDA8" stroke="#e3cf6a"/>
  <text x="554" y="360" font-size="12" font-weight="700" fill="#1f2d3d">AgentMemory</text>
  <text x="554" y="380" font-size="11" fill="#334155">长期记忆（workspace 维度）</text>
  <text x="554" y="398" font-size="11" fill="#2b6cb0">active / revoked / expired</text>

  <!-- Outbox 底部 -->
  <rect x="290" y="372" width="200" height="56" rx="8" fill="#FDEBD0" stroke="#e8c98a"/>
  <text x="304" y="396" font-size="12" font-weight="700" fill="#1f2d3d">OutboxEvent</text>
  <text x="304" y="414" font-size="11" fill="#334155">发件箱模式（独立）</text>

  <!-- 连接箭头 Run -> 四周 -->
  <g stroke="#94a3b8" stroke-width="1.4" fill="none">
    <path d="M 490 205 L 538 192" fill="none"/>
    <path d="M 490 215 L 538 272" fill="none"/>
    <path d="M 290 205 L 242 272" fill="none"/>
    <path d="M 390 232 L 390 266" fill="none"/>
    <path d="M 390 332 L 390 370" fill="none"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="538,192 530,188 531,197" fill="#94a3b8"/>
    <polygon points="538,272 530,268 531,277" fill="#94a3b8"/>
    <polygon points="242,272 250,268 249,277" fill="#94a3b8"/>
    <polygon points="390,266 384,258 396,258" fill="#94a3b8"/>
    <polygon points="390,370 384,362 396,362" fill="#94a3b8"/>
  </g>
  <text x="390" y="470" font-size="11" fill="#64748b" text-anchor="middle">Workspace / User 通过 workspace_id / *_user_id 关联；MySQL 存运行事实，PostgreSQL 存 LangGraph checkpoint</text>
</svg>
