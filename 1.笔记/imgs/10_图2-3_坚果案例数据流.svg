<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500">
  <rect x="0" y="0" width="680" height="500" fill="#FFFFFF"/>

  <rect x="200" y="18" width="280" height="52" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="212" y="28" width="256" height="32" rx="6" fill="#FFFFFF"/>
  <text x="224" y="43" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">一句话目标</text>
  <text x="224" y="58" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">分析坚果定位，给出主图方向，先审核</text>

  <rect x="30" y="96" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="42" y="106" width="176" height="36" rx="6" fill="#FFFFFF"/>
  <text x="54" y="121" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">商品上下文节点</text>
  <text x="54" y="136" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">售价、成本、人群、竞品</text>

  <rect x="240" y="96" width="200" height="56" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="252" y="106" width="176" height="36" rx="6" fill="#FFFFFF"/>
  <text x="264" y="121" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">诊断节点</text>
  <text x="264" y="136" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">定位、价格带、风险</text>

  <rect x="450" y="96" width="200" height="56" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="462" y="106" width="176" height="36" rx="6" fill="#FFFFFF"/>
  <text x="474" y="121" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">创意策略节点</text>
  <text x="474" y="136" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">数个主图方向与提示词</text>

  <rect x="450" y="176" width="200" height="56" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="462" y="186" width="176" height="36" rx="6" fill="#FFFFFF"/>
  <text x="474" y="201" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">质量合规节点</text>
  <text x="474" y="216" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">数量、差异度、不当承诺</text>

  <rect x="240" y="176" width="200" height="56" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="252" y="186" width="176" height="36" rx="6" fill="#FFFFFF"/>
  <text x="264" y="201" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">人工审核节点</text>
  <text x="264" y="216" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">暂停等待拍板</text>

  <rect x="30" y="176" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="42" y="186" width="176" height="36" rx="6" fill="#FFFFFF"/>
  <text x="54" y="201" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">收尾落库节点</text>
  <text x="54" y="216" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">通过则保存，驳回则不落库</text>

  <path d="M 340 70 L 340 92" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,96 336,89 344,89" fill="#7A94AD"/>
  <path d="M 230 124 L 236 124" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="240,124 233,120 233,128" fill="#7A94AD"/>
  <path d="M 440 124 L 446 124" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="450,124 443,120 443,128" fill="#7A94AD"/>
  <path d="M 550 152 L 550 172" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="550,176 546,169 554,169" fill="#7A94AD"/>
  <path d="M 450 204 L 446 204" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="440,204 447,200 447,208" fill="#7A94AD"/>
  <path d="M 240 204 L 236 204" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="230,204 237,200 237,208" fill="#7A94AD"/>

  <rect x="30" y="256" width="620" height="106" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="44" y="268" width="592" height="82" rx="6" fill="#FFFFFF"/>
  <text x="56" y="286" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">共享状态里被逐步填充的字段</text>
  <text x="56" y="306" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">上下文 → 诊断草稿 → 创意方案列表 → 质量报告 → 审核决定 → 采用内容</text>
  <text x="56" y="324" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">返修次数与已用额度同步累加，任何节点都只能读自己需要的部分</text>
  <text x="56" y="342" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">每一步的输入输出快照先脱敏，再写入运行事件</text>

  <rect x="30" y="382" width="620" height="94" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="44" y="394" width="592" height="70" rx="6" fill="#FFFFFF"/>
  <text x="56" y="412" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">这个案例里的两条纪律</text>
  <text x="56" y="432" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">低糖不能被扩写成无糖或保证减肥，自动检查只是辅助，不能穷尽虚假宣传</text>
  <text x="56" y="450" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">批准采用的主图方向仍是文字方案，真实出图继续走后台生成任务</text>
</svg>
