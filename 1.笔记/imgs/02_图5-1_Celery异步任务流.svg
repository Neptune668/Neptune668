<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="340" fill="#F7F9FC"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2D3D">图 5-1　Celery 异步任务流（API → Redis → Worker）</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5B7AA0"/>
    </marker>
  </defs>

  <!-- boxes -->
  <rect x="40" y="130" width="120" height="64" rx="10" fill="#FFFFFF" stroke="#9DB8D6" stroke-width="1.5"/>
  <text x="100" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2D3D">浏览器 / 前端</text>
  <text x="100" y="178" text-anchor="middle" font-size="11" fill="#5B7AA0">点击「生成」</text>

  <rect x="200" y="130" width="120" height="64" rx="10" fill="#E6F1FB" stroke="#5B9BD5" stroke-width="1.5"/>
  <text x="260" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2D3D">API 进程</text>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#356088">Producer 创建任务</text>

  <rect x="360" y="130" width="120" height="64" rx="10" fill="#EAF3DE" stroke="#8BC34A" stroke-width="1.5"/>
  <text x="420" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2D3D">Redis</text>
  <text x="420" y="178" text-anchor="middle" font-size="11" fill="#5A7D2A">Broker 任务队列</text>

  <rect x="520" y="130" width="120" height="64" rx="10" fill="#EEEDFE" stroke="#9B8CFF" stroke-width="1.5"/>
  <text x="580" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2D3D">Celery Worker</text>
  <text x="580" y="178" text-anchor="middle" font-size="11" fill="#6A5ACD">Consumer 执行</text>

  <!-- top arrows -->
  <line x1="160" y1="162" x2="196" y2="162" stroke="#5B7AA0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="162" x2="356" y2="162" stroke="#5B7AA0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="162" x2="516" y2="162" stroke="#5B7AA0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step labels -->
  <text x="170" y="152" font-size="10" fill="#356088">①</text>
  <text x="330" y="152" font-size="10" fill="#356088">② .delay()</text>
  <text x="490" y="152" font-size="10" fill="#356088">③ 取走</text>

  <!-- MySQL -->
  <rect x="520" y="250" width="120" height="58" rx="10" fill="#FAEDA8" stroke="#E0B500" stroke-width="1.5"/>
  <text x="580" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2D3D">MySQL</text>
  <text x="580" y="296" text-anchor="middle" font-size="11" fill="#8A6D00">任务状态表</text>

  <!-- Worker -> MySQL -->
  <line x1="580" y1="194" x2="580" y2="248" stroke="#5B7AA0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="216" font-size="10" fill="#6A5ACD">④ 调用供应商</text>
  <text x="596" y="236" font-size="10" fill="#8A6D00">⑤ 写回状态</text>

  <!-- polling back -->
  <path d="M520,279 C360,300 220,300 100,210" fill="none" stroke="#B0BEC5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="262" y="314" font-size="11" fill="#78909C">⑥ 前端拿任务编号轮询状态</text>
</svg>
