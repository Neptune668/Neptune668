<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2d3d">配置加载流向</text>
  <text x="24" y="54" font-size="12" fill="#2b6cb0">只有 get_settings() 读取环境变量，业务模块不再各自调用 os.getenv</text>

  <!-- 源文件 -->
  <rect x="28" y="170" width="160" height="80" rx="10" fill="#FAEDA8" stroke="#e3cf6a"/>
  <text x="108" y="200" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">api/.env</text>
  <text x="108" y="222" font-size="11" fill="#334155" text-anchor="middle">变量名 = 值</text>
  <text x="108" y="238" font-size="11" fill="#2b6cb0" text-anchor="middle">不提交 Git</text>

  <!-- Pydantic Settings -->
  <rect x="260" y="156" width="160" height="108" rx="10" fill="#E6F1FB" stroke="#9cc2e6"/>
  <text x="340" y="186" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">Settings</text>
  <text x="340" y="208" font-size="11" fill="#334155" text-anchor="middle">get_settings()</text>
  <text x="340" y="226" font-size="11" fill="#334155" text-anchor="middle">类型校验</text>
  <text x="340" y="244" font-size="11" fill="#334155" text-anchor="middle">生产安全校验</text>

  <!-- 连接线 -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M 188 210 L 256 210" fill="none"/>
    <path d="M 420 190 L 496 150" fill="none"/>
    <path d="M 420 210 L 496 210" fill="none"/>
    <path d="M 420 230 L 496 270" fill="none"/>
    <path d="M 420 245 L 496 330" fill="none"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="496,150 488,145 488,155" fill="#94a3b8"/>
    <polygon points="496,210 488,205 488,215" fill="#94a3b8"/>
    <polygon points="496,270 488,265 488,275" fill="#94a3b8"/>
    <polygon points="496,330 488,325 488,335" fill="#94a3b8"/>
  </g>

  <!-- 分支卡片 -->
  <rect x="504" y="116" width="156" height="68" rx="10" fill="#EAF3DE" stroke="#a9cf8a"/>
  <text x="582" y="142" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">database_url</text>
  <text x="582" y="162" font-size="11" fill="#334155" text-anchor="middle">SQLAlchemy</text>
  <text x="582" y="178" font-size="11" fill="#2b6cb0" text-anchor="middle">连接 MySQL</text>

  <rect x="504" y="178" width="156" height="64" rx="10" fill="#E6F1FB" stroke="#9cc2e6"/>
  <text x="582" y="202" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">redis_url</text>
  <text x="582" y="222" font-size="11" fill="#334155" text-anchor="middle">Celery 队列</text>
  <text x="582" y="238" font-size="11" fill="#2b6cb0" text-anchor="middle">连接 Redis</text>

  <rect x="504" y="238" width="156" height="64" rx="10" fill="#FAEDA8" stroke="#e3cf6a"/>
  <text x="582" y="262" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">cors_origins</text>
  <text x="582" y="282" font-size="11" fill="#334155" text-anchor="middle">FastAPI CORS</text>
  <text x="582" y="298" font-size="11" fill="#2b6cb0" text-anchor="middle">允许前端调用</text>

  <rect x="504" y="298" width="156" height="64" rx="10" fill="#EEEDFE" stroke="#b3abec"/>
  <text x="582" y="322" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">模型 / Agent 配置</text>
  <text x="582" y="342" font-size="11" fill="#334155" text-anchor="middle">后续 AI 模块</text>
  <text x="582" y="358" font-size="11" fill="#2b6cb0" text-anchor="middle">读取 LLM 等</text>
</svg>
