<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A94AD"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C0705A"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#FFFFFF"/>

  <!-- 起点 -->
  <rect x="200" y="14" width="280" height="44" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <text x="340" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">业务模块传入 messages</text>
  <text x="340" y="51" text-anchor="middle" font-size="10.5" fill="#2563EB">create_json_chat_completion</text>

  <path d="M 340 58 L 340 82" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>

  <!-- 第一步 -->
  <rect x="120" y="84" width="440" height="60" rx="8" fill="#EAF3DE" stroke="#A8C98A"/>
  <text x="140" y="106" font-size="13" font-weight="bold" fill="#2F4A20">第一步 拼接 URL</text>
  <text x="140" y="126" font-size="11.5" fill="#33472A">base_url 去掉尾部斜杠，再补 /chat/completions；已填完整路径则不重复拼接。</text>

  <path d="M 340 144 L 340 168" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>

  <!-- 第二步 -->
  <rect x="120" y="170" width="440" height="76" rx="8" fill="#FAEDA8" stroke="#D8BE5A"/>
  <text x="140" y="192" font-size="13" font-weight="bold" fill="#5C4A12">第二步 发送 HTTP 请求</text>
  <text x="140" y="212" font-size="11.5" fill="#4A3D12">Authorization: Bearer &lt;api_key&gt;；response_format 固定 json_object；stream=False；timeout=60。</text>
  <text x="140" y="232" font-size="10.5" fill="#2563EB">raise_for_status 把 401/429/500 立刻转成异常</text>

  <path d="M 340 246 L 340 270" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>

  <!-- 第三步 -->
  <rect x="120" y="272" width="440" height="76" rx="8" fill="#EEEDFE" stroke="#A9A4E0"/>
  <text x="140" y="294" font-size="13" font-weight="bold" fill="#3B3480">第三步 校验外层协议</text>
  <text x="140" y="314" font-size="11.5" fill="#3A3470">响应体必须是 JSON 对象，且能取到 choices[0].message.content。</text>
  <text x="140" y="334" font-size="10.5" fill="#2563EB">取不到就抛 LLMResponseError</text>

  <path d="M 340 348 L 340 372" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>

  <!-- 第四步 -->
  <rect x="120" y="374" width="440" height="76" rx="8" fill="#FDEBD0" stroke="#DDBE86"/>
  <text x="140" y="396" font-size="13" font-weight="bold" fill="#6B4B14">第四步 解析内层 JSON</text>
  <text x="140" y="416" font-size="11.5" fill="#5A4630">json.loads(content) 把 content 字符串转成字典；必须是对象而不是数组或空串。</text>
  <text x="140" y="436" font-size="10.5" fill="#2563EB">返回 (parsed, response_json) 两个值</text>

  <path d="M 340 450 L 340 474" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>

  <!-- 结果 -->
  <rect x="180" y="476" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <text x="340" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">业务拿到 Python 字典</text>
  <text x="340" y="516" text-anchor="middle" font-size="10.5" fill="#2563EB">后续章节不再重复判断模型返回格式</text>

  <!-- 右侧异常分支 -->
  <path d="M 560 200 L 618 200 L 618 300" stroke="#C0705A" stroke-width="1.4" marker-end="url(#arb)" fill="none"/>
  <rect x="528" y="300" width="128" height="150" rx="8" fill="#FAECE7" stroke="#D9A79A"/>
  <text x="592" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7A2E1E">异常分类</text>
  <line x1="540" y1="332" x2="644" y2="332" stroke="#E8CFC7"/>
  <text x="540" y="352" font-size="11" fill="#5A3A32">未配齐 → 400</text>
  <text x="540" y="372" font-size="11" fill="#5A3A32">网络失败 → 502</text>
  <text x="540" y="392" font-size="11" fill="#5A3A32">厂商报错 → 502</text>
  <text x="540" y="412" font-size="11" fill="#5A3A32">不是 JSON → 502</text>
  <text x="540" y="436" font-size="10" fill="#2563EB">400 没配好</text>
  <text x="540" y="450" font-size="10" fill="#2563EB">502 上游失败</text>
</svg>
