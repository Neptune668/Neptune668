<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" width="680" height="232">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="232" fill="#FFFFFF"/>

  <text x="125" y="52" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5A7A99">登记有什么</text>
  <text x="340" y="52" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5A7A99">登记谁能用</text>
  <text x="555" y="52" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5A7A99">登记怎么组合</text>

  <rect x="40" y="64" width="170" height="104" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="76" width="146" height="80" rx="6" fill="#FFFFFF"/>
  <text x="66" y="96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">TOOL_REGISTRY</text>
  <text x="66" y="114" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">工具键 → 风险级</text>
  <text x="66" y="130" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">幂等标记</text>
  <text x="66" y="146" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">是否仅所有者</text>

  <rect x="255" y="64" width="170" height="104" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="267" y="76" width="146" height="80" rx="6" fill="#FFFFFF"/>
  <text x="281" y="96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">AGENT_REGISTRY</text>
  <text x="281" y="114" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">角色键 → 白名单</text>
  <text x="281" y="130" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">白名单里是工具键</text>
  <text x="281" y="146" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">可以为空集合</text>

  <rect x="470" y="64" width="170" height="104" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="482" y="76" width="146" height="80" rx="6" fill="#FFFFFF"/>
  <text x="496" y="96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">WORKFLOW_REGISTRY</text>
  <text x="496" y="114" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">业务线键 → 角色序列</text>
  <text x="496" y="130" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">必填上下文字段</text>
  <text x="496" y="146" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">默认风险级</text>

  <path d="M 210 116 L 251 116" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 425 116 L 466 116" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="340" y="196" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">箭头方向就是引用方向</text>
  <text x="340" y="216" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">白名单里的每个名字都要能在左表查到，业务线里的每个角色都要能在中表查到</text>
</svg>
