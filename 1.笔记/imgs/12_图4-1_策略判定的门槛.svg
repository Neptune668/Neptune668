<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 428" width="680" height="428">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="428" fill="#FFFFFF"/>

  <text x="170" y="30" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5A7A99">依次经过的判断</text>
  <text x="470" y="30" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5A7A99">结果</text>

  <rect x="40" y="40" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="46" width="256" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="62" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">1 角色是否已登记</text>
  <text x="64" y="78" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">在九个角色的目录里查不到即出错</text>
  <path d="M 324 64 L 340 64" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="344" y="40" width="296" height="48" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="356" y="46" width="272" height="36" rx="6" fill="#FFFFFF"/>
  <text x="368" y="70" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">抛出策略异常 Agent is not registered</text>

  <rect x="40" y="104" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="110" width="256" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="126" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">2 工具是否已登记</text>
  <text x="64" y="142" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">在十六项工具的目录里查不到即出错</text>
  <path d="M 324 128 L 340 128" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="344" y="104" width="296" height="48" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="356" y="110" width="272" height="36" rx="6" fill="#FFFFFF"/>
  <text x="368" y="134" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">抛出策略异常 Tool is not registered</text>

  <rect x="40" y="168" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="174" width="256" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="190" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">3 工具是否在角色白名单内</text>
  <text x="64" y="206" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">这一步挡住绝大多数越权调用</text>
  <path d="M 324 192 L 340 192" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="344" y="168" width="296" height="48" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="356" y="174" width="272" height="36" rx="6" fill="#FFFFFF"/>
  <text x="368" y="198" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">抛出策略异常 is not allowed to use tool</text>

  <rect x="40" y="232" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="238" width="256" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="254" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">4 只读成员且工具不是 R0</text>
  <text x="64" y="270" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">只读成员只被允许做只读分析</text>
  <path d="M 324 256 L 340 256" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="344" y="232" width="296" height="48" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="356" y="238" width="272" height="36" rx="6" fill="#FFFFFF"/>
  <text x="368" y="262" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">返回 allowed=False，附可读原因</text>

  <rect x="40" y="296" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="302" width="256" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="318" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">5 仅限所有者而成员不是所有者</text>
  <text x="64" y="334" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">目前只有库存调整这项工具会走到这里</text>
  <path d="M 324 320 L 340 320" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="344" y="296" width="296" height="48" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="356" y="302" width="272" height="36" rx="6" fill="#FFFFFF"/>
  <text x="368" y="326" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">返回 allowed=False，附可读原因</text>

  <rect x="40" y="360" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="366" width="256" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="382" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">6 以上都不触发</text>
  <text x="64" y="398" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">允许调用，是否要审批看风险级</text>
  <path d="M 324 384 L 340 384" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="344" y="360" width="296" height="48" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="356" y="366" width="272" height="36" rx="6" fill="#FFFFFF"/>
  <text x="368" y="382" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">allowed=True，R2 与 R3 附带 requires_approval</text>
  <text x="368" y="398" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">策略许可不等于可以跳过人工确认</text>
</svg>
