<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" width="680" height="530">
  <rect x="0" y="0" width="680" height="530" fill="#FFFFFF"/>

  <rect x="60" y="24" width="390" height="56" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="34" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="49" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">接口校验商品与创意方案</text>
  <text x="84" y="64" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">归属校验与方案类型校验通过才继续</text>

  <rect x="60" y="108" width="390" height="56" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="118" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="133" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">enqueue_generation_job 创建任务</text>
  <text x="84" y="148" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">状态 pending，写入 queued 事件</text>

  <rect x="60" y="192" width="390" height="56" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="202" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="217" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">dispatch_generation_job 选择执行方式</text>
  <text x="84" y="232" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">inline 后台任务，或 Celery 队列消息</text>

