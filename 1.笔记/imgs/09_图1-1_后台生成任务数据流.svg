  <rect x="74" y="286" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="301" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">run_generation_job 在行锁内执行</text>
  <text x="84" y="316" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">状态 running，attempts 加 1，写 started</text>

  <rect x="60" y="360" width="390" height="56" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="370" width="362" height="36" rx="6" fill="#FFFFFF"/>
