  <text x="84" y="400" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">结果写入方案内容与 GeneratedAsset</text>

  <rect x="60" y="444" width="390" height="56" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="454" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="469" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">succeeded 与 result 素材字典</text>
  <text x="84" y="484" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">url 为项目本地路径，等待人工审核</text>

  <rect x="480" y="280" width="160" height="56" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="492" y="290" width="136" height="36" rx="6" fill="#FFFFFF"/>
