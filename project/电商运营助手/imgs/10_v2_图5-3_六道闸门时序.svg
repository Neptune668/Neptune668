size="9" fill="#5A7A99" text-anchor="middle">工具网关</text><rect x="142" y="146" width="84" height="1" rx="0" fill="#C9D6E5"/><text x="184" y="162" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#1F4E79" text-anchor="middle">每次调用前</text><text x="184" y="180" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#B45309" text-anchor="middle" font-weight="700">防住：</text><text x="184" y="194" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">重投造成重复副作</text><text x="184" y="205" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">用</text><path d="M 184 208 L 184 214" fill="none" stroke="#7A94AD" stroke-width="1.5"/><rect x="244" y="70" width="100" height="138" rx="6" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/><circle cx="294" cy="90" r="12" fill="#1F4E79"/><text x="294" y="94" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="294" y="116" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="700">预算扣减</text><text x="294" y="136" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">Harness</text><rect x="252" y="146" width="84" height="1" rx="0" fill="#C9D6E5"/><text x="294" y="162" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#1F4E79" text-anchor="middle">调模型前</text><text x="294" y="180" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#B45309" text-anchor="middle" font-weight="700">防住：</text><text x="294" y="194" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">多轮调用超出预算</text><path d="M 294 208 L 294 214" fill="none" stroke="#7A94AD" stroke-width="1.5"/><rect x="354" y="70" width="100" height="138" rx="6" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><circle cx="404" cy="90" r="12" fill="#1F4E79"/><text x="404" y="94" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="404" y="116" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="700">超时与维护</text><text x="404" y="136" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">维护模块</text><rect x="362" y="146" width="84" height="1" rx="0" fill="#C9D6E5"/><text x="404" y="162" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#1F4E79" text-anchor="middle">运行期间</text><text x="404" y="180" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#B45309" text-anchor="middle" font-weight="700">防住：</text><text x="404" y="194" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">崩溃或超时长期占</text><text x="404" y="205" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">资源</text><path d="M 404 208 L 404 214" fill="none" stroke="#7A94AD" stroke-width="1.5"/><rect x="464" y="70" width="100" height="138" rx="6" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/><circle cx="514" cy="90" r="12" fill="#1F4E79"/><text x="514" y="94" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="514" y="116" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="700">审批门</text><text x="514" y="136" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">任务服务</text><rect x="472" y="146" width="84" height="1" rx="0" fill="#C9D6E5"/><text x="514" y="162" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#1F4E79" text-anchor="middle">落库之前</text><text x="514" y="180" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#B45309" text-anchor="middle" font-weight="700">防住：</text><text x="514" y="194" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">未确认就写入正式</text><text x="514" y="205" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">对象</text><path d="M 514 208 L 514 214" fill="none" stroke="#7A94AD" stroke-width="1.5"/><rect x="574" y="70" width="100" height="138" rx="6" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><circle cx="624" cy="90" r="12" fill="#1F4E79"/><text x="624" y="94" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text><text x="624" y="116" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="700">检查点恢复</text><text x="624" y="136" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">持久化+运行</text><rect x="582" y="146" width="84" height="1" rx="0" fill="#C9D6E5"/><text x="624" y="162" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#1F4E79" text-anchor="middle">暂停之后</text><text x="624" y="180" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#B45309" text-anchor="middle" font-weight="700">防住：</text><text x="624" y="194" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#5A7A99" text-anchor="middle">中断后从头重跑</text><path d="M 624 208 L 624 214" fill="none" stroke="#7A94AD" stroke-width="1.5"/><text x="24" y="244" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start" font-weight="700">六道里有三道都在防重复，但不是冗余，因为重复来源不同</text><rect x="24" y="256" width="204" height="72" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="32" y="263" width="188" height="58" rx="6" fill="#FFFFFF"/><text x="44" y="289.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">租约</text><text x="44" y="306.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">防并发重复</text><text x="44" y="312" 