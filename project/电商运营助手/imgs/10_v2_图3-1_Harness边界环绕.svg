<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 506" width="680" height="506">
<rect x="0" y="0" width="680" height="506" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">Harness 的边界环绕结构</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="24" y="44" width="632" height="452" rx="10" fill="#FAECE7" stroke="#E7B9AB" stroke-width="1"/><rect x="68" y="43" width="180" height="1" rx="0" fill="#FFFFFF"/><text x="40" y="66" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">边界之外：模型供应商与外部系统</text><rect x="56" y="76" width="568" height="388" rx="10" fill="#FDEBD0" stroke="#EBC48F" stroke-width="1"/><rect x="100" y="75" width="180" height="1" rx="0" fill="#FFFFFF"/><text x="72" y="98" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">第五层：副作用边界</text><text x="72" y="115" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">写入正式业务对象必须经人工审批，同一运行只接受一次最终决定</text><rect x="88" y="108" width="504" height="324" rx="10" fill="#EAF3DE" stroke="#AFCFA0" stroke-width="1"/><rect x="132" y="107" width="180" height="1" rx="0" fill="#FFFFFF"/><text x="104" y="130" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">第四层：时间边界</text><text x="104" y="147" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">租约五分钟、心跳六十秒、软硬超时 1700 / 1800 秒，到期回收</text><rect x="120" y="140" width="440" height="260" rx="10" fill="#FAEDA8" stroke="#E0C96A" stroke-width="1"/><rect x="164" y="139" width="180" height="1" rx="0" fill="#FFFFFF"/><text x="136" y="162" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">第三层：预算边界</text><text x="136" y="179" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">总预算一万二千 Token，调用前截断，耗尽即熔断</text><rect x="152" y="172" width="376" height="196" rx="10" fill="#EEEDFE" stroke="#C5C3EC" stroke-width="1"/><rect x="196" y="171" width="180" height="1" rx="0" fill="#FFFFFF"/><text x="168" y="194" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">第二层：权限边界</text><text x="168" y="211" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">白名单、工作区身份、所有者专用、风险级别</text><rect x="184" y="204" width="312" height="132" rx="10" fill="#E6F1FB" stroke="#9CC3E5" stroke-width="1"/><rect x="228" y="203" width="180" height="1" rx="0" fill="#FFFFFF"/><text x="200" y="226" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">第一层：结构边界</text><text x="200" y="243" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">只交换定义过的结构，多余字段直接拒绝</text><rect x="248" y="252" width="184" height="62" rx="8" fill="#FFFFFF" stroke="#9CC3E5" stroke-width="1"/><text x="340" y="277" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F4E79" text-anchor="middle" font-weight="700">Agent 节点</text><text x="340" y="295" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">负责做什么</text><text x="340" y="309" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="middle">不负责能做什么</text><text x="340" y="392" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="middle" font-weight="700">Harness 负责「在什么范围内做」</text><text x="340" y="418" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle">任何一次对外访问都必须穿过全部五层</text><text x="340" y="438" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="middle">穿不过去，不是被拒绝，而是根本不会发生</text>
</svg>
