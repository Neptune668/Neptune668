<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="680" height="404">
<rect x="0" y="0" width="680" height="404" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">从单次调用到受控多 Agent 协作</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="24" y="54" width="292" height="30" rx="5" fill="#8FA5B8"/><text x="38" y="74" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="start" font-weight="700">单次模型调用</text><rect x="364" y="54" width="292" height="30" rx="5" fill="#1F4E79"/><text x="378" y="74" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="start" font-weight="700">受控多 Agent 协作</text><rect x="24" y="94" width="292" height="66" rx="8" fill="#F2F5F8" stroke="#C9D6E5" stroke-width="1"/><rect x="32" y="101" width="276" height="52" rx="6" fill="#FFFFFF"/><text x="44" y="124.0" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">输入资料</text><text x="44" y="141.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">人自己备好商品与竞品资料</text><path d="M 170 160 L 170 172" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="170,178 166,171 174,171" fill="#7A94AD"/><rect x="24" y="178" width="292" height="66" rx="8" fill="#F2F5F8" stroke="#C9D6E5" stroke-width="1"/><rect x="32" y="185" width="276" height="52" rx="6" fill="#FFFFFF"/><text x="44" y="208.0" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">一次调用，直接出结果</text><text x="44" y="225.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">中间发生了什么无人知晓</text><path d="M 170 244 L 170 256" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="170,262 166,255 174,255" fill="#7A94AD"/><rect x="24" y="262" width="292" height="66" rx="8" fill="#F2F5F8" stroke="#C9D6E5" stroke-width="1"/><rect x="32" y="269" width="276" height="52" rx="6" fill="#FFFFFF"/><text x="44" y="292.0" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">结构化结果</text><text x="44" y="309.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">好不好只能靠人自己看</text><rect x="364" y="94" width="292" height="54" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="372" y="101" width="276" height="40" rx="6" fill="#FFFFFF"/><circle cx="386" cy="121.0" r="12" fill="#1F4E79"/><text x="386" y="125.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="406" y="118.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">运营目标进入</text><text x="406" y="135.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">一句话，不是一串接口顺序</text><path d="M 510 148 L 510 150" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="510,156 506,149 514,149" fill="#7A94AD"/><rect x="364" y="156" width="292" height="54" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/><rect x="372" y="163" width="276" height="40" rx="6" fill="#FFFFFF"/><circle cx="386" cy="183.0" r="12" fill="#1F4E79"/><text x="386" y="187.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="406" y="180.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">路由到已注册业务线</text><text x="406" y="197.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">建立任务与运行，记录版本</text><path d="M 510 210 L 510 212" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="510,218 506,211 514,211" fill="#7A94AD"/><rect x="364" y="218" width="292" height="54" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="372" y="225" width="276" height="40" rx="6" fill="#FFFFFF"/><circle cx="386" cy="245.0" r="12" fill="#1F4E79"/><text x="386" y="249.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="406" y="242.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">Agent 依次执行</text><text x="406" y="259.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">每步结果写回共享状态</text><path d="M 510 272 L 510 274" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="510,280 506,273 514,273" fill="#7A94AD"/><rect x="364" y="280" width="292" height="54" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/><rect x="372" y="287" width="276" height="40" rx="6" fill="#FFFFFF"/><circle cx="386" cy="307.0" r="12" fill="#1F4E79"/><text x="386" y="311.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="406" y="304.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">工具受白名单与策略约束</text><text x="406" y="321.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">风险动作暂停等人拍板</text><path d="M 510 334 L 510 336" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="510,342 506,335 514,335" fill="#7A94AD"/><rect x="364" y="342" width="292" height="54" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="372" y="349" width="276" height="40" rx="6" fill="#FFFFFF"/><circle cx="386" cy="369.0" r="12" fill="#1F4E79"/><text x="386" y="373.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="406" y="366.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">产出可审核草稿</text><text x="406" y="383.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">不是终稿，先审后定</text><rect x="24" y="348" width="632" height="42" rx="6" fill="#FAECE7" stroke="#E7B9AB" stroke-width="1"/><text x="340" y="366" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle">六处不足：无共享状态 · 无权限边界 · 无质量门 · 无过程记录 · 目标要人拆 · 停不下来等人</text><text x="340" y="383" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="middle">右边每一步都对应一类约束，把左边做不到的补齐</text><path d="M 316 250 L 356 250" fill="none" stroke="#B45309" stroke-width="1.5"/><polygon points="362,250 355,246 355,254" fill="#B45309"/><text x="339" y="240" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="middle" font-weight="700">演进</text>
</svg>
