<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540">
  <rect x="0" y="0" width="680" height="540" fill="#FFFFFF"/>

  <rect x="24" y="20" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="36" y="30" width="226" height="36" rx="6" fill="#FFFFFF"/>
  <text x="48" y="46" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">一、定合同</text>
  <text x="48" y="63" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">声明可交换的数据结构</text>

  <rect x="406" y="20" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="418" y="30" width="226" height="36" rx="6" fill="#FFFFFF"/>
  <text x="430" y="46" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">二、做注册</text>
  <text x="430" y="63" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">角色、工具、业务线与版本</text>

  <rect x="406" y="96" width="250" height="56" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="418" y="106" width="226" height="36" rx="6" fill="#FFFFFF"/>
  <text x="430" y="122" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">三、判授权</text>
  <text x="430" y="139" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">允许、拒绝或需审批</text>

  <rect x="24" y="96" width="250" height="56" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="36" y="106" width="226" height="36" rx="6" fill="#FFFFFF"/>
  <text x="48" y="122" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">四、走网关</text>
  <text x="48" y="139" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">租约、幂等键、执行与记录</text>

  <rect x="24" y="172" width="250" height="56" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="36" y="182" width="226" height="36" rx="6" fill="#FFFFFF"/>
  <text x="48" y="198" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">五、记事件</text>
  <text x="48" y="215" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">开始、完成、失败，先脱敏</text>

  <rect x="406" y="172" width="250" height="56" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="418" y="182" width="226" height="36" rx="6" fill="#FFFFFF"/>
  <text x="430" y="198" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">六、过质量门</text>
  <text x="430" y="215" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">分数与问题清单，受控返修</text>

  <rect x="215" y="248" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="227" y="258" width="226" height="36" rx="6" fill="#FFFFFF"/>
  <text x="239" y="274" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">七、审批落库</text>
  <text x="239" y="291" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">高风险动作等人拍板</text>

  <path d="M 274 48 L 402 48" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="406,48 399,44 399,52" fill="#7A94AD"/>
  <path d="M 531 76 L 531 96" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="531,96 527,89 535,89" fill="#7A94AD"/>
  <path d="M 406 124 L 274 124" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="274,124 281,120 281,128" fill="#7A94AD"/>
  <path d="M 149 152 L 149 172" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="149,172 145,165 153,165" fill="#7A94AD"/>
  <path d="M 274 200 L 402 200" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="406,200 399,196 399,204" fill="#7A94AD"/>
  <path d="M 531 228 L 531 244 L 340 244 L 340 248" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,248 336,241 344,241" fill="#7A94AD"/>
  <path d="M 215 276 L 149 276 L 149 248 L 149 248" stroke="#7A94AD" stroke-width="1.5" fill="none"/>

  <rect x="24" y="326" width="632" height="94" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="38" y="338" width="604" height="70" rx="6" fill="#FFFFFF"/>
  <text x="50" y="356" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">流程里的两处「停下来」</text>
  <text x="50" y="376" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">第三步：高风险动作停下来等审批，未拿到审批就不会执行</text>
  <text x="50" y="394" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">第七步：人工审核停下来等拍板，暂停前不产生任何副作用</text>
  <text x="50" y="412" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">两处都必须先持久化状态，再用同一线程标识恢复</text>

  <rect x="24" y="436" width="632" height="82" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="38" y="448" width="604" height="58" rx="6" fill="#FFFFFF"/>
  <text x="50" y="466" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">顺序不能颠倒的两个理由</text>
  <text x="50" y="486" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">先注册再授权：没有声明过的角色与工具，授权无从判断</text>
  <text x="50" y="504" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">先执行再记录：记录的是执行结果而不是意图，事后才能回放</text>
</svg>
