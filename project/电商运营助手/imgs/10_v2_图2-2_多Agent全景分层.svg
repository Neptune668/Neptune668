<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 528" width="680" height="528">
<rect x="0" y="0" width="680" height="528" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">多 Agent 全景分层（一次请求的纵向剖面）</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="24" y="66" width="632" height="74" rx="6" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="24" y="66" width="148" height="74" rx="6" fill="#E6F1FB"/><rect x="148" y="66" width="2" height="74" rx="0" fill="#C9D6E5"/><text x="40" y="98" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F4E79" text-anchor="start" font-weight="700">运行与接口层</text><text x="40" y="118" font-family="Inter, Consolas, monospace" font-size="10" fill="#5A7A99" text-anchor="start">第 5 层</text><rect x="160" y="74" width="484" height="58" rx="6" fill="#FFFFFF"/><text x="174" y="96" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start">接口收目标返结果，运行层管认领、事件、状态、恢复与回收</text><text x="174" y="116" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">卖家看到「待审核」，是运行层把状态推过去的</text><circle cx="636" cy="84" r="12" fill="#1F4E79"/><text x="636" y="88" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><rect x="24" y="148" width="632" height="74" rx="6" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/><rect x="24" y="148" width="148" height="74" rx="6" fill="#EEEDFE"/><rect x="148" y="148" width="2" height="74" rx="0" fill="#C9D6E5"/><text x="40" y="180" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F4E79" text-anchor="start" font-weight="700">编排层</text><text x="40" y="200" font-family="Inter, Consolas, monospace" font-size="10" fill="#5A7A99" text-anchor="start">第 4 层</text><rect x="160" y="156" width="484" height="58" rx="6" fill="#FFFFFF"/><text x="174" y="178" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start">决定节点顺序、分支条件与暂停点，不直接碰数据或模型</text><text x="174" y="198" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">基础图把诊断排在创意前面</text><circle cx="636" cy="166" r="12" fill="#1F4E79"/><text x="636" y="170" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><rect x="24" y="230" width="632" height="74" rx="6" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="24" y="230" width="148" height="74" rx="6" fill="#EAF3DE"/><rect x="148" y="230" width="2" height="74" rx="0" fill="#C9D6E5"/><text x="40" y="262" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F4E79" text-anchor="start" font-weight="700">执行层</text><text x="40" y="282" font-family="Inter, Consolas, monospace" font-size="10" fill="#5A7A99" text-anchor="start">第 3 层</text><rect x="160" y="238" width="484" height="58" rx="6" fill="#FFFFFF"/><text x="174" y="260" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start">Harness 模块、工具网关、专业节点，脱敏预算与规则兜底</text><text x="174" y="280" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">诊断节点调模型出草稿，网关做租约与幂等校验</text><circle cx="636" cy="248" r="12" fill="#1F4E79"/><text x="636" y="252" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><rect x="24" y="312" width="632" height="74" rx="6" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/><rect x="24" y="312" width="148" height="74" rx="6" fill="#FAEDA8"/><rect x="148" y="312" width="2" height="74" rx="0" fill="#C9D6E5"/><text x="40" y="344" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F4E79" text-anchor="start" font-weight="700">注册与策略层</text><text x="40" y="364" font-family="Inter, Consolas, monospace" font-size="10" fill="#5A7A99" text-anchor="start">第 2 层</text><rect x="160" y="320" width="484" height="58" rx="6" fill="#FFFFFF"/><text x="174" y="342" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start">注册表与策略：九个 Agent、十六项工具、七条业务线与风险判定</text><text x="174" y="362" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">声明谁可用什么，不决定执行先后</text><circle cx="636" cy="330" r="12" fill="#1F4E79"/><text x="636" y="334" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><rect x="24" y="394" width="632" height="74" rx="6" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/><rect x="24" y="394" width="148" height="74" rx="6" fill="#FDEBD0"/><rect x="148" y="394" width="2" height="74" rx="0" fill="#C9D6E5"/><text x="40" y="426" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F4E79" text-anchor="start" font-weight="700">合同层</text><text x="40" y="446" font-family="Inter, Consolas, monospace" font-size="10" fill="#5A7A99" text-anchor="start">第 1 层</text><rect x="160" y="402" width="484" height="58" rx="6" fill="#FFFFFF"/><text x="174" y="424" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start">上下文、草稿、质量报告、事件、共享状态</text><text x="174" y="444" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">节点之间能交换什么数据在这里定死</text><circle cx="636" cy="412" r="12" fill="#1F4E79"/><text x="636" y="416" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><rect x="24" y="484" width="632" height="34" rx="6" fill="#F8FAFD" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="505" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start">硬规矩：节点只通过结构化状态和受控工具交换数据，不许绕过策略边界直接写结果</text><text x="644" y="505" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="end">约束由上到下逐渐变硬</text>
</svg>
