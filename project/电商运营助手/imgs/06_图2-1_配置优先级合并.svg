<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A94AD"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#FFFFFF"/>

  <!-- 左：环境变量 -->
  <rect x="24" y="30" width="230" height="150" rx="8" fill="#EAF3DE" stroke="#A8C98A"/>
  <rect x="36" y="42" width="206" height="126" rx="6" fill="#FFFFFF" stroke="#D6E8C4"/>
  <text x="139" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#2F4A20">api/.env</text>
  <text x="139" y="84" text-anchor="middle" font-size="10.5" fill="#2563EB">部署环境默认值</text>
  <line x1="48" y1="94" x2="230" y2="94" stroke="#D6E8C4"/>
  <text x="52" y="114" font-size="11.5" fill="#22303F">LLM_BASE_URL = https://…</text>
  <text x="52" y="134" font-size="11.5" fill="#22303F">LLM_API_KEY  = sk-…</text>
  <text x="52" y="154" font-size="11.5" fill="#22303F">LLM_MODEL    = deepseek-chat</text>

  <!-- 右：数据库 -->
  <rect x="426" y="30" width="230" height="150" rx="8" fill="#FAEDA8" stroke="#D8BE5A"/>
  <rect x="438" y="42" width="206" height="126" rx="6" fill="#FFFFFF" stroke="#E8DFC0"/>
  <text x="541" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C4A12">model_provider_settings</text>
  <text x="541" y="84" text-anchor="middle" font-size="10.5" fill="#B45309">管理员运行后修改</text>
  <line x1="450" y1="94" x2="632" y2="94" stroke="#E8DFC0"/>
  <text x="454" y="114" font-size="11.5" fill="#22303F">target = text</text>
  <text x="454" y="134" font-size="11.5" fill="#22303F">base_url = （空）</text>
  <text x="454" y="154" font-size="11.5" fill="#22303F">model    = deepseek-v4-pro</text>

  <!-- 中间箭头 -->
  <path d="M 254 105 L 426 105" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
  <text x="340" y="96" text-anchor="middle" font-size="11" fill="#2563EB">数据库非空字段覆盖</text>
  <text x="340" y="126" text-anchor="middle" font-size="10.5" fill="#2563EB">空字段不覆盖</text>

  <!-- 合并节点 -->
  <path d="M 139 180 L 139 208" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
  <path d="M 541 180 L 541 208" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
  <rect x="214" y="210" width="252" height="52" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <text x="340" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">_row_value 逐字段合并</text>
  <text x="340" y="251" text-anchor="middle" font-size="10.5" fill="#2563EB">库中有值用库里的，库里为空则用环境变量</text>

  <path d="M 340 262 L 340 288" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>

  <!-- 结果 -->
  <rect x="164" y="290" width="352" height="96" rx="8" fill="#EEEDFE" stroke="#A9A4E0"/>
  <rect x="176" y="302" width="328" height="72" rx="6" fill="#FFFFFF" stroke="#DDD9F2"/>
  <text x="340" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#3B3480">本次请求真正使用的配置</text>
  <text x="196" y="346" font-size="11.5" fill="#22303F">llm_base_url = https://…      （来自 .env）</text>
  <text x="196" y="364" font-size="11.5" fill="#22303F">llm_model    = deepseek-v4-pro（来自数据库）</text>

  <!-- 底部说明 -->
  <rect x="24" y="404" width="632" height="52" rx="8" fill="#FDEBD0" stroke="#DDBE86"/>
  <text x="44" y="428" font-size="12" font-weight="bold" fill="#6B4B14">为什么要这样设计</text>
  <text x="44" y="448" font-size="11.5" fill="#5A4630">管理员只想换模型名时，不需要把地址和密钥重新填一遍；只改一个字段不会把其余字段意外清空。</text>
</svg>
