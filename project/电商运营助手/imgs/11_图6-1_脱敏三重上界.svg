<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460">
  <rect x="0" y="0" width="680" height="460" fill="#FFFFFF"/>
  <rect x="40" y="24" width="600" height="64" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="34" width="576" height="44" rx="6" fill="#FFFFFF"/>
  <text x="64" y="52" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">进入快照的任意结构</text>
  <text x="64" y="68" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">多层嵌套字典、一整段超长文本，或含上万条记录的列表</text>
  <rect x="40" y="110" width="190" height="124" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="120" width="166" height="104" rx="6" fill="#FFFFFF"/>
  <text x="62" y="142" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">上界 深度</text>
  <text x="62" y="166" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">8 层</text>
  <text x="62" y="186" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">超深嵌套耗尽栈</text>
  <text x="62" y="203" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">自引用结构无限递归</text>
  <text x="62" y="220" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">[truncated-depth]</text>
  <rect x="245" y="110" width="190" height="124" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="257" y="120" width="166" height="104" rx="6" fill="#FFFFFF"/>
  <text x="267" y="142" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">上界 条目</text>
  <text x="267" y="166" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">200 项</text>
  <text x="267" y="186" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">单个列表塞进上万条</text>
  <text x="267" y="203" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">字典记数，列表追加</text>
  <text x="267" y="220" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">[truncated-items:N]</text>
  <rect x="450" y="110" width="190" height="124" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="462" y="120" width="166" height="104" rx="6" fill="#FFFFFF"/>
  <text x="472" y="142" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">上界 长度</text>
  <text x="472" y="166" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">2000 字符</text>
  <text x="472" y="186" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">字段值是超长文本</text>
  <text x="472" y="203" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">末尾追加截断标记</text>
  <text x="472" y="220" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">...[truncated]</text>
  <rect x="40" y="264" width="600" height="60" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="274" width="576" height="40" rx="6" fill="#FFFFFF"/>
  <text x="64" y="292" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">输出 可回放、体积有硬上界的快照</text>
  <text x="64" y="310" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">结构保持原样，超出的部分换成截断标记，而不是整份丢弃</text>
  <rect x="40" y="350" width="190" height="84" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="360" width="166" height="64" rx="6" fill="#FFFFFF"/>
  <text x="62" y="380" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">只看长度不看深度</text>
  <text x="62" y="400" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">自引用结构会让递归</text>
  <text x="62" y="416" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">直接爆栈</text>
  <rect x="245" y="350" width="190" height="84" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="257" y="360" width="166" height="64" rx="6" fill="#FFFFFF"/>
  <text x="267" y="380" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">只看深度不看条目</text>
  <text x="267" y="400" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">十万条记录让每次事件</text>
  <text x="267" y="416" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">写入巨量数据</text>
  <rect x="450" y="350" width="190" height="84" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="462" y="360" width="166" height="64" rx="6" fill="#FFFFFF"/>
  <text x="472" y="380" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">只看前两者不看长度</text>
  <text x="472" y="400" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">单个字段的整篇文本</text>
  <text x="472" y="416" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">同样会拖垮存储</text>
  <path d="M 135 88 L 135 106" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="135,110 131,103 139,103" fill="#7A94AD"/>
  <path d="M 135 234 L 135 258" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="135,264 131,257 139,257" fill="#7A94AD"/>
  <path d="M 340 88 L 340 106" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,110 336,103 344,103" fill="#7A94AD"/>
  <path d="M 340 234 L 340 258" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,264 336,257 344,257" fill="#7A94AD"/>
  <path d="M 545 88 L 545 106" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="545,110 541,103 549,103" fill="#7A94AD"/>
  <path d="M 545 234 L 545 258" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="545,264 541,257 549,257" fill="#7A94AD"/>
</svg>
