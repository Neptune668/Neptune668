<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540">
  <rect x="0" y="0" width="680" height="540" fill="#FFFFFF"/>

  <rect x="40" y="24" width="370" height="60" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="34" width="342" height="40" rx="6" fill="#FFFFFF"/>
  <text x="64" y="50" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">ProductContext 商品经营上下文</text>
  <text x="64" y="67" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">内嵌 CompetitorContext 列表，整条流水线的只读输入</text>

  <rect x="40" y="110" width="370" height="60" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="120" width="342" height="40" rx="6" fill="#FFFFFF"/>
  <text x="64" y="136" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">DiagnosisDraft 诊断稿</text>
  <text x="64" y="153" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">定位、价格带、痛点、卖点分析、风险、建议、来源</text>

  <rect x="40" y="196" width="370" height="60" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="206" width="342" height="40" rx="6" fill="#FFFFFF"/>
  <text x="64" y="222" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">CreativePlanDraft 创意方向稿</text>
  <text x="64" y="239" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">标题、切入角度、版式、主副标题、画面焦点、提示词</text>

  <rect x="40" y="282" width="370" height="60" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="292" width="342" height="40" rx="6" fill="#FFFFFF"/>
  <text x="64" y="308" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">AgentDraftOutput 整包草稿</text>
  <text x="64" y="325" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">一份诊断加三到六份方向，人审面对的整体对象</text>

  <rect x="40" y="368" width="370" height="60" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="378" width="342" height="40" rx="6" fill="#FFFFFF"/>
  <text x="64" y="394" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">QualityReport 质量结论</text>
  <text x="64" y="411" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">是否通过、零到一百分、问题清单、是否建议返修</text>

  <rect x="40" y="454" width="370" height="60" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="464" width="342" height="40" rx="6" fill="#FFFFFF"/>
  <text x="64" y="480" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">ReviewResumePayload 人审决定</text>
  <text x="64" y="497" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">通过、编辑并通过、驳回三选一，携带编辑后的输出</text>

  <rect x="440" y="24" width="200" height="490" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="452" y="36" width="176" height="466" rx="6" fill="#FFFFFF"/>
  <text x="462" y="60" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">AgentWorkflowState</text>
  <text x="462" y="82" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">贯穿全程的共享状态</text>
  <text x="462" y="112" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">run_id 本次运行标识</text>
  <text x="462" y="136" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">product_id 目标商品</text>
  <text x="462" y="160" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">context 上文第一格</text>
  <text x="462" y="184" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">diagnosis 诊断结果</text>
  <text x="462" y="208" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">creative_plans 方向列表</text>
  <text x="462" y="232" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">quality_report 质量结论</text>
  <text x="462" y="256" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">revision_count 返修次数</text>
  <text x="462" y="280" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">max_revisions 次数上限</text>
  <text x="462" y="304" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">budget 本次总预算</text>
  <text x="462" y="328" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">usage 累计模型用量</text>
  <text x="462" y="352" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">review 人审结果</text>
  <text x="462" y="376" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">approved_output 放行稿</text>
  <text x="462" y="400" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">final_output 成品快照</text>
  <text x="462" y="424" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">final_status 运行终态</text>
  <text x="462" y="458" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">TypedDict 只描述形状</text>
  <text x="462" y="476" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">运行时校验交给左侧模型</text>

