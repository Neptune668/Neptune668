  <polygon points="225,368 221,361 229,361" fill="#7A94AD"/>
  <path d="M 225 428 L 225 450" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="225,454 221,447 229,447" fill="#7A94AD"/>

