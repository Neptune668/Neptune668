<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="680" height="580" fill="#FFFFFF"/>

  <rect x="16" y="14" width="648" height="38" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <text x="340" y="39" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F3A5F">四类业务产物都是「有字段的字典」，不是一段聊天文字</text>

  <!-- 第一类 商品诊断 -->
  <rect x="16" y="64" width="316" height="230" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <rect x="28" y="76" width="292" height="206" rx="6" fill="#FFFFFF" stroke="#D9E6F2"/>
  <text x="40" y="98" font-size="12.5" font-weight="bold" fill="#1F3A5F">第一类 商品诊断</text>
  <text x="150" y="98" font-size="10" fill="#2563EB">product_diagnoses 表</text>
  <line x1="40" y1="106" x2="308" y2="106" stroke="#D9E6F2"/>
  <text x="40" y="126" font-size="10.5" fill="#22303F">source          llm / rules</text>
  <text x="40" y="144" font-size="10.5" fill="#22303F">positioning     一句话定位</text>
  <text x="40" y="162" font-size="10.5" fill="#22303F">price_band      价格带判断</text>
  <text x="40" y="180" font-size="10.5" fill="#22303F">audience_insights  人群洞察[]</text>
  <text x="40" y="198" font-size="10.5" fill="#22303F">pain_points     痛点[]</text>
  <text x="40" y="216" font-size="10.5" fill="#22303F">selling_point_analysis  卖点分析[]</text>
  <text x="40" y="234" font-size="10.5" fill="#22303F">risks           风险[]</text>
  <text x="40" y="252" font-size="10.5" fill="#22303F">recommendations 下一步动作[]</text>
  <text x="40" y="272" font-size="10" fill="#2563EB">raw_output 保存模型、用量与回退原因</text>

  <!-- 第二类 主图方案 -->
  <rect x="348" y="64" width="316" height="230" rx="8" fill="#FAEDA8" stroke="#D8BE5A"/>
  <rect x="360" y="76" width="292" height="206" rx="6" fill="#FFFFFF" stroke="#E8DFC0"/>
  <text x="372" y="98" font-size="12.5" font-weight="bold" fill="#5C4A12">第二类 主图方案</text>
  <text x="482" y="98" font-size="10" fill="#B45309">creative_plans 表</text>
  <line x1="372" y1="106" x2="640" y2="106" stroke="#E8DFC0"/>
  <text x="372" y="126" font-size="10.5" fill="#22303F">type            main_image</text>
  <text x="372" y="144" font-size="10.5" fill="#22303F">title / angle   方案标题与测试角度</text>
  <text x="372" y="162" font-size="10.5" fill="#22303F">layout          画面布局</text>
  <text x="372" y="180" font-size="10.5" fill="#22303F">headline        主文案</text>
  <text x="372" y="198" font-size="10.5" fill="#22303F">sub_headline    副文案</text>
  <text x="372" y="216" font-size="10.5" fill="#22303F">visual_focus    视觉重点</text>
  <text x="372" y="234" font-size="10.5" fill="#22303F">proof_points    证明点[]</text>
  <text x="372" y="252" font-size="10.5" fill="#22303F">suitable_audience / image_prompt</text>
  <text x="372" y="272" font-size="10" fill="#B45309">image_prompt 是文字，本章不出图</text>

  <!-- 第三类 视频脚本 -->
  <rect x="16" y="306" width="316" height="190" rx="8" fill="#FDEBD0" stroke="#DDBE86"/>
  <rect x="28" y="318" width="292" height="166" rx="6" fill="#FFFFFF" stroke="#ECD9B0"/>
  <text x="40" y="340" font-size="12.5" font-weight="bold" fill="#6B4B14">第三类 视频脚本</text>
  <text x="150" y="340" font-size="10" fill="#8A6D00">creative_plans 表</text>
  <line x1="40" y1="348" x2="308" y2="348" stroke="#ECD9B0"/>
  <text x="40" y="368" font-size="10.5" fill="#22303F">type            video_script</text>
  <text x="40" y="386" font-size="10.5" fill="#22303F">hook            前三秒钩子</text>
  <text x="40" y="404" font-size="10.5" fill="#22303F">duration_seconds  建议时长 15-60 秒</text>
  <text x="40" y="422" font-size="10.5" fill="#22303F">scenes[]        shot / visual / voiceover</text>
  <text x="40" y="440" font-size="10.5" fill="#22303F">selling_point_proof  卖点证明[]</text>
  <text x="40" y="458" font-size="10.5" fill="#22303F">cta             转化引导</text>
  <text x="40" y="476" font-size="10" fill="#8A6D00">video_prompt 供后续视频生成使用</text>

  <!-- 第四类 建议复盘实验 -->
  <rect x="348" y="306" width="316" height="190" rx="8" fill="#EAF3DE" stroke="#A8C98A"/>
  <rect x="360" y="318" width="292" height="166" rx="6" fill="#FFFFFF" stroke="#D6E8C4"/>
  <text x="372" y="340" font-size="12.5" font-weight="bold" fill="#2F4A20">第四类 建议、复盘与实验</text>
  <line x1="372" y1="348" x2="640" y2="348" stroke="#D6E8C4"/>
  <text x="372" y="368" font-size="10.5" fill="#22303F">库存建议  summary / risks /</text>
  <text x="392" y="385" font-size="10.5" fill="#22303F">replenishment_actions / ad_controls</text>
  <text x="372" y="405" font-size="10.5" fill="#22303F">经营复盘  period_start / summary /</text>
  <text x="392" y="422" font-size="10.5" fill="#22303F">insights / next_actions</text>
  <text x="372" y="442" font-size="10.5" fill="#22303F">投放建议  audience_segments / budget_plan /</text>
  <text x="392" y="459" font-size="10.5" fill="#22303F">creative_tests / risk_controls</text>
  <text x="372" y="479" font-size="10" fill="#4E7A2A">实验草稿 status=draft，不调用模型</text>

  <!-- 底部 -->
  <rect x="16" y="508" width="648" height="58" rx="8" fill="#EEEDFE" stroke="#A9A4E0"/>
  <text x="36" y="530" font-size="12" font-weight="bold" fill="#3B3480">共同约定</text>
  <text x="36" y="549" font-size="10.5" fill="#3A3470">每个产物都带 source 字段标明来源；数组字段用 Pydantic 约束最少与最多条数；保存前不做自动发布动作。</text>
  <text x="36" y="562" font-size="10" fill="#2563EB">运营人员在页面或 Swagger 中查看、编辑、确认后才进入下一环节。</text>
</svg>
