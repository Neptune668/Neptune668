<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 516" width="680" height="516">
<rect width="680" height="516" fill="#FFFFFF"/>
<rect x="40" y="24" width="300" height="56" rx="8" fill="#E6F1FB"/>
<rect x="46" y="30" width="288" height="44" rx="6" fill="#FFFFFF"/>
<text x="60" y="50" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">product_context_agent</text>
<text x="60" y="68" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">读取商品与竞品上下文</text>
<path d="M 190 80 L 190 102" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="190,102 186,95 194,95" fill="#7A94AD"/>
<rect x="40" y="94" width="300" height="56" rx="8" fill="#E6F1FB"/>
<rect x="46" y="100" width="288" height="44" rx="6" fill="#FFFFFF"/>
<text x="60" y="120" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">diagnosis_agent</text>
<text x="60" y="138" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">生成诊断草稿</text>
<path d="M 190 150 L 190 172" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="190,172 186,165 194,165" fill="#7A94AD"/>
<rect x="40" y="164" width="300" height="56" rx="8" fill="#E6F1FB"/>
<rect x="46" y="170" width="288" height="44" rx="6" fill="#FFFFFF"/>
<text x="60" y="190" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">creative_strategy_agent</text>
<text x="60" y="208" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">生成创意方向</text>
<path d="M 190 220 L 190 242" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="190,242 186,235 194,235" fill="#7A94AD"/>
<rect x="40" y="234" width="300" height="56" rx="8" fill="#FAEDA8"/>
<rect x="46" y="240" width="288" height="44" rx="6" fill="#FFFFFF"/>
<text x="60" y="260" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">quality_review_agent</text>
<text x="60" y="278" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">按规则检查质量</text>
<rect x="400" y="234" width="240" height="56" rx="8" fill="#FDEBD0"/>
<rect x="406" y="240" width="228" height="44" rx="6" fill="#FFFFFF"/>
<text x="420" y="254" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">prepare_revision</text>
<text x="420" y="272" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">累加返修次数，整理质量问题</text>
<path d="M 340 262 L 388 262" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="396,262 389,258 389,266" fill="#7A94AD"/>
<text x="300" y="300" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">不通过且还有次数</text>
<path d="M 520 234 L 520 130 L 190 130 L 190 160" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4"/>
<polygon points="190,168 186,161 194,161" fill="#94A3B8"/>
<text x="360" y="124" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">回到诊断，重新生成</text>
<rect x="40" y="330" width="300" height="56" rx="8" fill="#EEEDFE"/>
<rect x="46" y="336" width="288" height="44" rx="6" fill="#FFFFFF"/>
<text x="60" y="350" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">human_review_gate</text>
<text x="60" y="368" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">interrupt 暂停，等待合法恢复输入</text>
<path d="M 190 290 L 190 322" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="190,322 186,315 194,315" fill="#7A94AD"/>
<text x="196" y="310" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">通过或次数用完</text>
<rect x="40" y="416" width="300" height="56" rx="8" fill="#EAF3DE"/>
<rect x="46" y="422" width="288" height="44" rx="6" fill="#FFFFFF"/>
<text x="60" y="436" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">finalize_output</text>
<text x="60" y="454" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">按决定收尾，写回最终状态</text>
<path d="M 190 386 L 190 408" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="190,408 186,401 194,401" fill="#7A94AD"/>
<text x="60" y="500" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">回边只允许走 max_revisions 次，次数用完强制进入人工审核</text>
</svg>
