<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="720" height="210" fill="#F5F8FC"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">项目运营总链路：一个商品的七步运营流水线</text>

  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- arrows between steps -->
  <path d="M 98 122 L 112 122" stroke="#475569" stroke-width="2.5" marker-end="url(#ah2)" fill="none"/>
  <path d="M 200 122 L 214 122" stroke="#475569" stroke-width="2.5" marker-end="url(#ah2)" fill="none"/>
  <path d="M 302 122 L 316 122" stroke="#475569" stroke-width="2.5" marker-end="url(#ah2)" fill="none"/>
  <path d="M 404 122 L 418 122" stroke="#475569" stroke-width="2.5" marker-end="url(#ah2)" fill="none"/>
  <path d="M 506 122 L 520 122" stroke="#475569" stroke-width="2.5" marker-end="url(#ah2)" fill="none"/>
  <path d="M 608 122 L 622 122" stroke="#475569" stroke-width="2.5" marker-end="url(#ah2)" fill="none"/>

  <!-- step 3 ribbon -->
  <text x="264" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">★ 重点案例</text>

  <!-- step 1 -->
  <g>
    <rect x="12" y="90" width="84" height="64" rx="10" fill="#E6F1FB" stroke="#2F6FED" stroke-width="2"/>
    <rect x="18" y="96" width="22" height="18" rx="4" fill="#1F2937"/>
    <text x="29" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="58" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">基础数据</text>
    <text x="58" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">准备</text>
    <text x="54" y="172" text-anchor="middle" font-size="10.5" fill="#2563EB">商品/SKU/</text>
    <text x="54" y="186" text-anchor="middle" font-size="10.5" fill="#2563EB">库存记录</text>
  </g>

  <!-- step 2 -->
  <g>
    <rect x="114" y="90" width="84" height="64" rx="10" fill="#EAF3DE" stroke="#4E9A3E" stroke-width="2"/>
    <rect x="120" y="96" width="22" height="18" rx="4" fill="#1F2937"/>
    <text x="131" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="160" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">竞品持续</text>
    <text x="160" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">监控</text>
    <text x="156" y="172" text-anchor="middle" font-size="10.5" fill="#2563EB">竞品监控</text>
    <text x="156" y="186" text-anchor="middle" font-size="10.5" fill="#2563EB">快照</text>
  </g>

  <!-- step 3 (key) -->
  <g>
    <rect x="216" y="90" width="84" height="64" rx="10" fill="#FAECE7" stroke="#DC2626" stroke-width="2.5"/>
    <rect x="222" y="96" width="22" height="18" rx="4" fill="#1F2937"/>
    <text x="233" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="262" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">商品诊断</text>
    <text x="262" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">与优化</text>
    <text x="258" y="172" text-anchor="middle" font-size="10.5" fill="#2563EB">诊断草稿·</text>
    <text x="258" y="186" text-anchor="middle" font-size="10.5" fill="#2563EB">创意方案</text>
  </g>

  <!-- step 4 -->
  <g>
    <rect x="318" y="90" width="84" height="64" rx="10" fill="#FAEDA8" stroke="#CA8A04" stroke-width="2"/>
    <rect x="324" y="96" width="22" height="18" rx="4" fill="#1F2937"/>
    <text x="335" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
    <text x="364" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">创意与</text>
    <text x="364" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">素材生产</text>
    <text x="360" y="172" text-anchor="middle" font-size="10.5" fill="#2563EB">候选素材</text>
    <text x="360" y="186" text-anchor="middle" font-size="10.5" fill="#2563EB">版本</text>
  </g>

  <!-- step 5 -->
  <g>
    <rect x="420" y="90" width="84" height="64" rx="10" fill="#EEEDFE" stroke="#6D28D9" stroke-width="2"/>
    <rect x="426" y="96" width="22" height="18" rx="4" fill="#1F2937"/>
    <text x="437" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
    <text x="466" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">投放实验</text>
    <text x="466" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">闭环</text>
    <text x="462" y="172" text-anchor="middle" font-size="10.5" fill="#2563EB">投放实验·</text>
    <text x="462" y="186" text-anchor="middle" font-size="10.5" fill="#2563EB">证据链</text>
  </g>

  <!-- step 6 -->
  <g>
    <rect x="522" y="90" width="84" height="64" rx="10" fill="#FDEBD0" stroke="#E08A1E" stroke-width="2"/>
    <rect x="528" y="96" width="22" height="18" rx="4" fill="#1F2937"/>
    <text x="539" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
    <text x="568" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">周期经营</text>
    <text x="568" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">复盘</text>
    <text x="564" y="172" text-anchor="middle" font-size="10.5" fill="#2563EB">可编辑</text>
    <text x="564" y="186" text-anchor="middle" font-size="10.5" fill="#2563EB">复盘报告</text>
  </g>

  <!-- step 7 -->
  <g>
    <rect x="624" y="90" width="84" height="64" rx="10" fill="#E0F2F1" stroke="#0D9488" stroke-width="2"/>
    <rect x="630" y="96" width="22" height="18" rx="4" fill="#1F2937"/>
    <text x="641" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text>
    <text x="670" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">库存运营</text>
    <text x="670" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">店铺巡检</text>
    <text x="666" y="172" text-anchor="middle" font-size="10.5" fill="#2563EB">库存建议·</text>
    <text x="666" y="186" text-anchor="middle" font-size="10.5" fill="#2563EB">巡检分派</text>
  </g>
</svg>
