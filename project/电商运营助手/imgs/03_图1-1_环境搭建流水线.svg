<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2d3d">环境搭建整体流水线</text>
  <text x="24" y="54" font-size="12" fill="#2b6cb0">从空目录到前后端可启动共六步，按顺序一次只验证一层，前一步成功再做下一步</text>

  <!-- 连接箭头 -->
  <g fill="#94a3b8">
    <polygon points="340,124 332,112 348,112" fill="#94a3b8"/>
    <polygon points="340,186 332,174 348,174" fill="#94a3b8"/>
    <polygon points="340,248 332,236 348,236" fill="#94a3b8"/>
    <polygon points="340,310 332,298 348,298" fill="#94a3b8"/>
    <polygon points="340,372 332,360 348,360" fill="#94a3b8"/>
  </g>

  <!-- 步骤卡片 -->
  <!-- 1 -->
  <circle cx="88" cy="100" r="16" fill="#E6F1FB" stroke="#9cc2e6" stroke-width="1.5"/>
  <text x="88" y="105" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">1</text>
  <rect x="116" y="76" width="500" height="48" rx="8" fill="#E6F1FB" stroke="#cdd9e8"/>
  <text x="132" y="98" font-size="14" font-weight="700" fill="#1f2d3d">创建项目目录结构</text>
  <text x="132" y="116" font-size="11" fill="#2b6cb0">git init · uv init api · npx create-next-app web</text>

  <!-- 2 -->
  <circle cx="88" cy="162" r="16" fill="#EAF3DE" stroke="#a9cf8a" stroke-width="1.5"/>
  <text x="88" y="167" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">2</text>
  <rect x="116" y="138" width="500" height="48" rx="8" fill="#EAF3DE" stroke="#cfe0bb"/>
  <text x="132" y="160" font-size="14" font-weight="700" fill="#1f2d3d">配置 Git 忽略与环境变量</text>
  <text x="132" y="178" font-size="11" fill="#2b6cb0">.gitignore · .env.example 复制为 .env 并填写真实密码</text>

  <!-- 3 -->
  <circle cx="88" cy="224" r="16" fill="#EEEDFE" stroke="#b3abec" stroke-width="1.5"/>
  <text x="88" y="229" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">3</text>
  <rect x="116" y="200" width="500" height="48" rx="8" fill="#EEEDFE" stroke="#d6d2f4"/>
  <text x="132" y="222" font-size="14" font-weight="700" fill="#1f2d3d">启动三项基础服务</text>
  <text x="132" y="240" font-size="11" fill="#2b6cb0">docker compose up -d mysql redis agent-checkpoints</text>

  <!-- 4 -->
  <circle cx="88" cy="286" r="16" fill="#FAEDA8" stroke="#e3cf6a" stroke-width="1.5"/>
  <text x="88" y="291" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">4</text>
  <rect x="116" y="262" width="500" height="48" rx="8" fill="#FAEDA8" stroke="#ecdc97"/>
  <text x="132" y="284" font-size="14" font-weight="700" fill="#1f2d3d">安装后端依赖</text>
  <text x="132" y="302" font-size="11" fill="#2b6cb0">cd api · uv sync --extra dev 生成 .venv</text>

  <!-- 5 -->
  <circle cx="88" cy="348" r="16" fill="#E6F1FB" stroke="#9cc2e6" stroke-width="1.5"/>
  <text x="88" y="353" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">5</text>
  <rect x="116" y="324" width="500" height="48" rx="8" fill="#E6F1FB" stroke="#cdd9e8"/>
  <text x="132" y="346" font-size="14" font-weight="700" fill="#1f2d3d">后端配置中心</text>
  <text x="132" y="364" font-size="11" fill="#2b6cb0">api/.env + config.py 由 get_settings() 统一读取环境变量</text>

  <!-- 6 -->
  <circle cx="88" cy="410" r="16" fill="#EAF3DE" stroke="#a9cf8a" stroke-width="1.5"/>
  <text x="88" y="415" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">6</text>
  <rect x="116" y="386" width="500" height="48" rx="8" fill="#EAF3DE" stroke="#cfe0bb"/>
  <text x="132" y="408" font-size="14" font-weight="700" fill="#1f2d3d">启动前后端</text>
  <text x="132" y="426" font-size="11" fill="#2b6cb0">uvicorn app.main:app --reload · npm run dev</text>
</svg>
