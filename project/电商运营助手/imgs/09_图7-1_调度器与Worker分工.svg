<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340">
  <rect x="0" y="0" width="680" height="340" fill="#FFFFFF"/>

  <rect x="30" y="24" width="170" height="64" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="42" y="34" width="146" height="44" rx="6" fill="#FFFFFF"/>
  <text x="52" y="52" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">API 进程</text>
  <text x="52" y="69" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">校验、建任务、首次投递</text>

  <rect x="255" y="24" width="170" height="64" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="267" y="34" width="146" height="44" rx="6" fill="#FFFFFF"/>
  <text x="277" y="52" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">调度器进程</text>
  <text x="277" y="69" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">每 5 秒扫描到期 pending</text>

  <rect x="480" y="24" width="170" height="64" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="492" y="34" width="146" height="44" rx="6" fill="#FFFFFF"/>
  <text x="502" y="52" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">Celery Worker</text>
  <text x="502" y="69" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">消费消息并调用状态机</text>

  <rect x="255" y="140" width="170" height="52" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="267" y="150" width="146" height="32" rx="6" fill="#FFFFFF"/>
  <text x="277" y="165" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">Redis generation 队列</text>
  <text x="277" y="180" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">消息只携带本地任务 ID</text>

  <rect x="230" y="226" width="220" height="64" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="242" y="236" width="196" height="44" rx="6" fill="#FFFFFF"/>
  <text x="252" y="254" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">generation_jobs 表</text>
  <text x="252" y="271" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">状态、attempts、next_run_at、锁</text>

  <path d="M 340 88 L 340 138" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,140 336,133 344,133" fill="#7A94AD"/>
  <path d="M 425 166 L 478 166" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="480,166 474,162 474,170" fill="#7A94AD"/>

  <path d="M 115 88 L 115 200 L 300 200 L 300 222" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="300,224 296,217 304,217" fill="#7A94AD"/>
  <path d="M 565 88 L 565 200 L 380 200 L 380 222" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="380,224 376,217 384,217" fill="#7A94AD"/>

  <rect x="30" y="300" width="620" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="44" y="318" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">调度器只发现任务，Worker 只执行任务，API 只创建任务；执行入口用行锁保证同一条任务只启动一次</text>
</svg>
