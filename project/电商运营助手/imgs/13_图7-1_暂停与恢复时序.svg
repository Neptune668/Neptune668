<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 524" width="680" height="524">
<rect width="680" height="524" fill="#FFFFFF"/>
<rect x="40" y="24" width="600" height="64" rx="8" fill="#E6F1FB"/>
<rect x="46" y="30" width="588" height="52" rx="6" fill="#FFFFFF"/>
<text x="64" y="52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1F2937" font-weight="bold">graph.invoke(state)</text>
<text x="64" y="72" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">开始执行，依次走到人审节点</text>
<path d="M 340 88 L 340 112" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,112 336,105 344,105" fill="#7A94AD"/>
<rect x="40" y="108" width="600" height="64" rx="8" fill="#EEEDFE"/>
<rect x="46" y="114" width="588" height="52" rx="6" fill="#FFFFFF"/>
<text x="64" y="136" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1F2937" font-weight="bold">interrupt() 暂停</text>
<text x="64" y="156" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">草稿与质量报告写入检查点</text>
<path d="M 340 172 L 340 196" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,196 336,189 344,189" fill="#7A94AD"/>
<rect x="40" y="192" width="600" height="64" rx="8" fill="#EAF3DE"/>
<rect x="46" y="198" width="588" height="52" rx="6" fill="#FFFFFF"/>
<text x="64" y="220" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1F2937" font-weight="bold">graph.get_state(config)</text>
<text x="64" y="240" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">查看 next 指向哪个节点</text>
<path d="M 340 256 L 340 280" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,280 336,273 344,273" fill="#7A94AD"/>
<rect x="40" y="276" width="600" height="64" rx="8" fill="#FAEDA8"/>
<rect x="46" y="282" width="588" height="52" rx="6" fill="#FFFFFF"/>
<text x="64" y="304" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1F2937" font-weight="bold">Command(resume=决定)</text>
<text x="64" y="324" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">恢复输入先过 ReviewResumePayload 校验</text>
<path d="M 340 340 L 340 364" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,364 336,357 344,357" fill="#7A94AD"/>
<rect x="40" y="360" width="600" height="64" rx="8" fill="#FDEBD0"/>
<rect x="46" y="366" width="588" height="52" rx="6" fill="#FFFFFF"/>
<text x="64" y="388" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1F2937" font-weight="bold">finalize_output</text>
<text x="64" y="408" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">按决定收尾，写回最终状态</text>
<rect x="40" y="444" width="600" height="64" rx="8" fill="#FAECE7"/>
<rect x="46" y="450" width="588" height="52" rx="6" fill="#FFFFFF"/>
<text x="64" y="468" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">三条纪律</text>
<text x="64" y="488" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">暂停前不产生副作用；恢复必须用同一个 thread_id；恢复输入必须过校验</text>
</svg>
