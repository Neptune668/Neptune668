<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" width="680" height="530">
  <rect x="0" y="0" width="680" height="530" fill="#FFFFFF"/>

  <!-- 主流程盒子 -->
  <rect x="60" y="24" width="390" height="56" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="34" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="49" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">课件七已审核的 CreativePlan</text>
  <text x="84" y="64" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">主图方案 / 视频脚本类型校验</text>

  <rect x="60" y="108" width="390" height="56" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="118" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="133" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">从 content 取得 image_prompt 或 video_prompt</text>
  <text x="84" y="148" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">清理不兼容字符，保留业务语义</text>

  <rect x="60" y="192" width="390" height="56" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="202" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="217" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">供应商适配：提交任务 → task_id → 轮询状态</text>
  <text x="84" y="232" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">签名请求头、code=10000 校验、状态解析</text>

  <rect x="60" y="276" width="390" height="56" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="286" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="301" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">成功：取得临时资源 URL → 下载到 uploads/generated</text>
  <text x="84" y="316" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">图片 /uploads/generated，视频 /uploads/generated-videos</text>

  <rect x="60" y="360" width="390" height="56" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="370" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="385" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">返回含 provider、model、task_id、url 的素材字典</text>
  <text x="84" y="400" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">url 指向项目本地路径，不是供应商临时地址</text>

  <rect x="60" y="444" width="390" height="56" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="74" y="454" width="362" height="36" rx="6" fill="#FFFFFF"/>
  <text x="84" y="469" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">素材服务保存 GeneratedAsset，默认「待评估」</text>
  <text x="84" y="484" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">按 url 去重，等待人工审核后才可投放</text>

  <!-- 失败分支 -->
  <rect x="480" y="196" width="160" height="48" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="492" y="206" width="136" height="28" rx="6" fill="#FFFFFF"/>
  <text x="500" y="218" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">失败、取消、超时</text>
  <text x="500" y="230" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">抛明确错误，不伪造成功</text>

  <!-- 主干箭头 -->
  <path d="M 255 80 L 255 104" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="255,108 251,101 259,101" fill="#7A94AD"/>
  <path d="M 255 164 L 255 188" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="255,192 251,185 259,185" fill="#7A94AD"/>
  <path d="M 255 248 L 255 272" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="255,276 251,269 259,269" fill="#7A94AD"/>
  <path d="M 255 332 L 255 356" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="255,360 251,353 259,353" fill="#7A94AD"/>
  <path d="M 255 416 L 255 440" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="255,444 251,437 259,437" fill="#7A94AD"/>

  <!-- 失败分支横向箭头 -->
  <path d="M 450 220 L 476 220" stroke="#B0917F" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <polygon points="480,220 473,216 473,224" fill="#B0917F"/>
</svg>
