<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 512" width="680" height="512">
<rect width="680" height="512" fill="#FFFFFF"/>
<rect x="40" y="24" width="600" height="56" rx="8" fill="#E6F1FB"/>
<rect x="46" y="30" width="588" height="44" rx="6" fill="#FFFFFF"/>
<text x="64" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1F2937" font-weight="bold">require_active_lease()</text>
<text x="64" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">任一道不通过就抛 AgentLeaseLostError，不再继续</text>
<rect x="40" y="100" width="600" height="52" rx="8" fill="#FAEDA8"/>
<rect x="46" y="106" width="588" height="40" rx="6" fill="#FFFFFF"/>
<text x="64" y="124" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">1. 运行是否存在</text>
<text x="64" y="142" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">Agent run does not exist</text>
<path d="M 340 80 L 340 96" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,96 336,89 344,89" fill="#7A94AD"/>
<rect x="40" y="168" width="600" height="52" rx="8" fill="#FAEDA8"/>
<rect x="46" y="174" width="588" height="40" rx="6" fill="#FFFFFF"/>
<text x="64" y="192" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">2. 状态是否为运行中</text>
<text x="64" y="210" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">Agent run is no longer running</text>
<path d="M 340 148 L 340 164" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,164 336,157 344,157" fill="#7A94AD"/>
<rect x="40" y="236" width="600" height="52" rx="8" fill="#FAEDA8"/>
<rect x="46" y="242" width="588" height="40" rx="6" fill="#FFFFFF"/>
<text x="64" y="260" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">3. 所有者是否仍是自己</text>
<text x="64" y="278" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">Agent run lease has been replaced</text>
<path d="M 340 216 L 340 232" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,232 336,225 344,225" fill="#7A94AD"/>
<rect x="40" y="304" width="600" height="52" rx="8" fill="#FAEDA8"/>
<rect x="46" y="310" width="588" height="40" rx="6" fill="#FFFFFF"/>
<text x="64" y="328" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">4. 是否请求过取消</text>
<text x="64" y="346" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">Agent run cancellation was requested</text>
<path d="M 340 284 L 340 300" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,300 336,293 344,293" fill="#7A94AD"/>
<rect x="40" y="372" width="600" height="52" rx="8" fill="#FDEBD0"/>
<rect x="46" y="378" width="588" height="40" rx="6" fill="#FFFFFF"/>
<text x="64" y="396" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">5. 是否已超过超时时间</text>
<text x="64" y="414" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">Agent run exceeded timeout</text>
<path d="M 340 352 L 340 368" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,368 336,361 344,361" fill="#7A94AD"/>
<rect x="40" y="444" width="600" height="52" rx="8" fill="#EAF3DE"/>
<rect x="46" y="450" width="588" height="40" rx="6" fill="#FFFFFF"/>
<text x="64" y="468" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">五道全部通过，返回运行记录</text>
<text x="64" y="486" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">for_update=True 时同时加行锁并刷新会话中的对象</text>
<path d="M 340 424 L 340 440" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,440 336,433 344,433" fill="#7A94AD"/>
</svg>
