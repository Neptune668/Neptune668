<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A94AD"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#FFFFFF"/>

  <!-- 顶部：一张表分三类目标 -->
  <rect x="150" y="14" width="380" height="44" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <text x="340" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">数据表 model_provider_settings</text>
  <text x="340" y="52" text-anchor="middle" font-size="11" fill="#2563EB">target 字段唯一，一类目标只保存一条记录</text>

  <path d="M 340 58 L 340 82" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
  <path d="M 340 82 L 118 82 L 118 104" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
  <path d="M 340 82 L 340 104" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
  <path d="M 340 82 L 562 82 L 562 104" stroke="#7A94AD" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>

  <!-- 文本模型 -->
  <rect x="24" y="106" width="188" height="196" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <rect x="34" y="116" width="168" height="176" rx="6" fill="#FFFFFF" stroke="#D9E6F2"/>
  <text x="118" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">text 文本</text>
  <text x="118" y="158" text-anchor="middle" font-size="10.5" fill="#2563EB">本章真正调用</text>
  <line x1="40" y1="168" x2="196" y2="168" stroke="#D9E6F2"/>
  <text x="44" y="188" font-size="11.5" fill="#22303F">base_url</text>
  <text x="44" y="206" font-size="10" fill="#2563EB">服务根地址，补 /chat/completions</text>
  <text x="44" y="226" font-size="11.5" fill="#22303F">api_key</text>
  <text x="44" y="244" font-size="10" fill="#2563EB">调用密码，只写入不读出</text>
  <text x="44" y="264" font-size="11.5" fill="#22303F">model</text>
  <text x="44" y="282" font-size="10" fill="#2563EB">模型名称，如 deepseek-chat</text>

  <!-- 图片模型 -->
  <rect x="246" y="106" width="188" height="196" rx="8" fill="#FAEDA8" stroke="#D8BE5A"/>
  <rect x="256" y="116" width="168" height="176" rx="6" fill="#FFFFFF" stroke="#E8DFC0"/>
  <text x="340" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C4A12">image 图片</text>
  <text x="340" y="158" text-anchor="middle" font-size="10.5" fill="#B45309">后续章节接入</text>
  <line x1="262" y1="168" x2="418" y2="168" stroke="#E8DFC0"/>
  <text x="266" y="188" font-size="11.5" fill="#22303F">provider / base_url</text>
  <text x="266" y="206" font-size="11.5" fill="#22303F">api_key / model</text>
  <text x="266" y="226" font-size="11.5" fill="#22303F">size</text>
  <text x="266" y="244" font-size="10" fill="#2563EB">默认 1024*1024</text>
  <text x="266" y="264" font-size="11.5" fill="#22303F">workspace_id</text>
  <text x="266" y="282" font-size="11.5" fill="#22303F">poll_interval / max</text>

  <!-- 视频模型 -->
  <rect x="468" y="106" width="188" height="196" rx="8" fill="#EEEDFE" stroke="#A9A4E0"/>
  <rect x="478" y="116" width="168" height="176" rx="6" fill="#FFFFFF" stroke="#DDD9F2"/>
  <text x="562" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#3B3480">video 视频</text>
  <text x="562" y="158" text-anchor="middle" font-size="10.5" fill="#6D28D9">后续章节接入</text>
  <line x1="484" y1="168" x2="640" y2="168" stroke="#DDD9F2"/>
  <text x="488" y="188" font-size="11.5" fill="#22303F">provider / base_url</text>
  <text x="488" y="206" font-size="11.5" fill="#22303F">api_key / model</text>
  <text x="488" y="226" font-size="11.5" fill="#22303F">size / duration</text>
  <text x="488" y="244" font-size="10" fill="#2563EB">默认 1280*720、2 秒</text>
  <text x="488" y="264" font-size="11.5" fill="#22303F">workspace_id</text>
  <text x="488" y="282" font-size="11.5" fill="#22303F">poll_interval / max</text>

  <!-- 底部：安全边界 -->
  <rect x="24" y="322" width="632" height="60" rx="8" fill="#FAECE7" stroke="#D9A79A"/>
  <text x="44" y="346" font-size="13" font-weight="bold" fill="#7A2E1E">安全边界</text>
  <text x="44" y="366" font-size="11.5" fill="#5A3A32">api_key 可写入数据库；读取接口只返回 api_key_masked 与 has_api_key，浏览器、日志、异常都不出现完整密钥。</text>

  <!-- 底部：字段来源 -->
  <rect x="24" y="394" width="632" height="104" rx="8" fill="#EAF3DE" stroke="#A8C98A"/>
  <text x="44" y="418" font-size="13" font-weight="bold" fill="#2F4A20">字段的两种来源</text>
  <text x="44" y="440" font-size="11.5" fill="#33472A">.env 环境变量：开发者首次启动时提供的默认值，改一次需要重启进程。</text>
  <text x="44" y="460" font-size="11.5" fill="#33472A">数据库记录：管理员在系统运行后修改，保存即生效，不需要重启。</text>
  <text x="44" y="480" font-size="10.5" fill="#2563EB">运行时按「数据库非空字段覆盖环境变量」合并，未配置字段自动回退。</text>
</svg>
