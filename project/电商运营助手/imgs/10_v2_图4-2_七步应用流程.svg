<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 538" width="680" height="538">
<rect x="0" y="0" width="680" height="538" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">Harness 应用步骤七步法</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="24" y="54" width="632" height="50" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><circle cx="46" cy="79" r="12" fill="#1F4E79"/><text x="46" y="83" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="68" y="76" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">定合同</text><text x="68" y="93" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">声明可交换的数据结构，禁止多余字段</text><text x="392" y="76" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start" font-weight="700">合同模块</text><text x="392" y="93" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="start">校验不过，节点进不来</text><path d="M 340 104 L 340 104" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,110 336,103 344,103" fill="#7A94AD"/><rect x="24" y="110" width="632" height="50" rx="5" fill="#F8FAFD" stroke="#C9D6E5" stroke-width="1"/><circle cx="46" cy="135" r="12" fill="#1F4E79"/><text x="46" y="139" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="68" y="132" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">做注册</text><text x="68" y="149" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">声明 Agent、工具、业务线与版本</text><text x="392" y="132" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start" font-weight="700">注册表模块</text><text x="392" y="149" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="start">未注册的直接报错</text><path d="M 340 160 L 340 160" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,166 336,159 344,159" fill="#7A94AD"/><rect x="24" y="166" width="632" height="50" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><circle cx="46" cy="191" r="12" fill="#1F4E79"/><text x="46" y="195" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="68" y="188" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">判授权</text><text x="68" y="205" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">按白名单、身份与风险给允许/拒绝/需审批</text><text x="392" y="188" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start" font-weight="700">策略模块</text><text x="392" y="205" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="start">越权被拒，高风险转审批</text><path d="M 340 216 L 340 216" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,222 336,215 344,215" fill="#7A94AD"/><rect x="24" y="222" width="632" height="50" rx="5" fill="#F8FAFD" stroke="#C9D6E5" stroke-width="1"/><circle cx="46" cy="247" r="12" fill="#1F4E79"/><text x="46" y="251" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="68" y="244" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">走网关</text><text x="68" y="261" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">执行前复核租约、执行中幂等防重、执行后记录</text><text x="392" y="244" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start" font-weight="700">工具网关模块</text><text x="392" y="261" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="start">租约失效拒绝执行</text><path d="M 340 272 L 340 272" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,278 336,271 344,271" fill="#7A94AD"/><rect x="24" y="278" width="632" height="50" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><circle cx="46" cy="303" r="12" fill="#1F4E79"/><text x="46" y="307" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="68" y="300" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">记事件</text><text x="68" y="317" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">开始、完成、失败都写事件，先脱敏</text><text x="392" y="300" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start" font-weight="700">运行服务</text><text x="392" y="317" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="start">不阻塞执行，但丢了查不到</text><path d="M 340 328 L 340 328" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,334 336,327 344,327" fill="#7A94AD"/><rect x="24" y="334" width="632" height="50" rx="5" fill="#F8FAFD" stroke="#C9D6E5" stroke-width="1"/><circle cx="46" cy="359" r="12" fill="#1F4E79"/><text x="46" y="363" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text><text x="68" y="356" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">过质量门</text><text x="68" y="373" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">结构、依据、风险检查，给分数与问题清单</text><text x="392" y="356" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start" font-weight="700">专业节点与质量规则</text><text x="392" y="373" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="start">未通过且有次数则返修</text><path d="M 340 384 L 340 384" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,390 336,383 344,383" fill="#7A94AD"/><rect x="24" y="390" width="632" height="50" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><circle cx="46" cy="415" r="12" fill="#1F4E79"/><text x="46" y="419" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">7</text><text x="68" y="412" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">审批落库</text><text x="68" y="429" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">高风险动作等人决定，通过才写正式对象</text><text x="392" y="412" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start" font-weight="700">任务服务与审批记录</text><text x="392" y="429" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="start">驳回进已驳回终态</text><rect x="24" y="450" width="310" height="74" rx="6" fill="#FDEBD0" stroke="#EBC48F" stroke-width="1"/><text x="38" y="472" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#B45309" text-anchor="start" font-weight="700">两处「停下来」</text><text x="38" y="491" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">第三步：高风险停等审批，未拿到不执行</text><text x="38" y="508" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">第七步：人审停等拍板，暂停前零副作用</text><rect x="346" y="450" width="310" height="74" rx="6" fill="#E6F1FB" stroke="#9CC3E5" stroke-width="1"/><text x="360" y="472" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start" font-weight="700">顺序不能颠倒的理由</text><text x="360" y="491" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">先注册再授权：没声明过无从判断</text><text x="360" y="508" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">先执行再记录：记的是结果，事后可回放</text>
</svg>
