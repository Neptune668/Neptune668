<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
<rect x="0" y="0" width="680" height="400" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">注册表三件套的关系</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="24" y="52" width="200" height="82" rx="8" fill="#E6F1FB" stroke="#9CC3E5" stroke-width="1"/><rect x="32" y="59" width="184" height="68" rx="6" fill="#FFFFFF"/><text x="44" y="90.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">Agent 注册表</text><text x="44" y="107.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">九个 Agent + 工具白名单</text><rect x="240" y="52" width="200" height="82" rx="8" fill="#EAF3DE" stroke="#AFCFA0" stroke-width="1"/><rect x="248" y="59" width="184" height="68" rx="6" fill="#FFFFFF"/><text x="260" y="90.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">工具注册表</text><text x="260" y="107.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">十六项工具 + R0 至 R3</text><rect x="456" y="52" width="200" height="82" rx="8" fill="#EEEDFE" stroke="#C5C3EC" stroke-width="1"/><rect x="464" y="59" width="184" height="68" rx="6" fill="#FFFFFF"/><text x="476" y="90.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">工作流注册表</text><text x="476" y="107.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">七条业务线 + Agent 顺序</text><path d="M 224 78 L 232 78" fill="none" stroke="#1F4E79" stroke-width="1.5"/><polygon points="238,78 231,74 231,82" fill="#1F4E79"/><text x="231" y="70" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#1F4E79" text-anchor="middle">白名单</text><path d="M 224 110 L 238 110" fill="none" stroke="#1F4E79" stroke-width="1.5"/><text x="231" y="102" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#1F4E79" text-anchor="middle">被引用</text><path d="M 456 78 L 442 78" fill="none" stroke="#1F4E79" stroke-width="1.5"/><text x="449" y="70" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#1F4E79" text-anchor="middle">顺序</text><text x="556" y="146" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="middle">执行顺序由此推导，节点按声明顺序串联</text><text x="340" y="146" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="middle">风险级别写在工具上，不由 Agent 单独决定</text><text x="24" y="174" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">一次判定的完整链条（从左到右）</text><rect x="24" y="186" width="96" height="48" rx="6" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><text x="72" y="205" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">Agent</text><text x="72" y="220" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">是否注册</text><path d="M 120 210 L 124 210" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="130,210 123,206 123,214" fill="#7A94AD"/><rect x="132" y="186" width="96" height="48" rx="6" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><text x="180" y="205" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">工具</text><text x="180" y="220" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">是否注册</text><path d="M 228 210 L 232 210" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="238,210 231,206 231,214" fill="#7A94AD"/><rect x="240" y="186" width="96" height="48" rx="6" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><text x="288" y="205" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">在白</text><text x="288" y="220" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">名单内</text><path d="M 336 210 L 340 210" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="346,210 339,206 339,214" fill="#7A94AD"/><rect x="348" y="186" width="96" height="48" rx="6" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><text x="396" y="205" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">工作区</text><text x="396" y="220" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">身份</text><path d="M 444 210 L 448 210" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="454,210 447,206 447,214" fill="#7A94AD"/><rect x="456" y="186" width="96" height="48" rx="6" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><text x="504" y="205" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">所有者</text><text x="504" y="220" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">专用?</text><path d="M 552 210 L 556 210" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="562,210 555,206 555,214" fill="#7A94AD"/><rect x="564" y="186" width="96" height="48" rx="6" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/><text x="612" y="205" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">风险</text><text x="612" y="220" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="700">要审批?</text><text x="24" y="254" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start">坚果的诊断草稿工具：前五步都通过 → R1 不需审批 → 放行</text><text x="24" y="282" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">三条容易记错的规则</text><rect x="24" y="294" width="204" height="66" rx="8" fill="#FAEDA8" stroke="#E0C96A" stroke-width="1"/><rect x="32" y="301" width="188" height="52" rx="6" fill="#FFFFFF"/><text x="44" y="324.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">注册 ≠ 可执行</text><text x="44" y="341.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">网关没适配器照样拒绝</text><rect x="238" y="294" width="204" height="66" rx="8" fill="#FAEDA8" stroke="#E0C96A" stroke-width="1"/><rect x="246" y="301" width="188" height="52" rx="6" fill="#FFFFFF"/><text x="258" y="324.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">只读成员</text><text x="258" y="341.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">只能执行 R0 级工具</text><rect x="452" y="294" width="204" height="66" rx="8" fill="#FAEDA8" stroke="#E0C96A" stroke-width="1"/><rect x="460" y="301" width="188" height="52" rx="6" fill="#FFFFFF"/><text x="472" y="324.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">所有者专用</text><text x="472" y="341.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">只有工作区所有者可用</text><text x="24" y="380" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">业务线名称只表达方向，不等同于已经接通外部系统</text>
</svg>
