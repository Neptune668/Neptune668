<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <!-- 白底外框 -->
  <rect x="1" y="1" width="698" height="418" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1.5" rx="10"/>

  <!-- 标题 -->
  <text x="30" y="26" font-size="14" font-weight="700" fill="#33475B">电商运营助手 · 前后端分离架构</text>
  <text x="30" y="46" font-size="11" fill="#8A9BB0">应用层（浏览器 / 前端 / 后端 API / 外部模型）</text>

  <!-- 浏览器 -->
  <rect x="30" y="58" width="120" height="62" rx="8" fill="#E6F1FB" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="90" y="88" font-size="14" font-weight="700" fill="#2C4A6E" text-anchor="middle">浏览器</text>
  <text x="90" y="106" font-size="10" fill="#2C6FB5" text-anchor="middle">用户访问入口</text>

  <!-- Next.js 前端 -->
  <rect x="175" y="58" width="150" height="62" rx="8" fill="#E6F1FB" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="250" y="82" font-size="14" font-weight="700" fill="#2C4A6E" text-anchor="middle">Next.js 运营工作台</text>
  <text x="250" y="100" font-size="10" fill="#2C6FB5" text-anchor="middle">React 19 · TypeScript 5 · :3000</text>

  <!-- FastAPI -->
  <rect x="360" y="58" width="135" height="62" rx="8" fill="#EAF3DE" stroke="#7CB342" stroke-width="1.5"/>
  <text x="427" y="82" font-size="14" font-weight="700" fill="#3E5A1E" text-anchor="middle">FastAPI 后端</text>
  <text x="427" y="100" font-size="10" fill="#2C6FB5" text-anchor="middle">API · 校验 · :8000</text>

  <!-- 模型供应商 -->
  <rect x="545" y="58" width="120" height="62" rx="8" fill="#FAECE7" stroke="#E06666" stroke-width="1.5"/>
  <text x="605" y="82" font-size="14" font-weight="700" fill="#8A3B2E" text-anchor="middle">模型供应商</text>
  <text x="605" y="100" font-size="10" fill="#2C6FB5" text-anchor="middle">文字 / 图片 / 视频</text>

  <!-- 基础设施层背景带 -->
  <rect x="20" y="248" width="660" height="152" rx="10" fill="#F5F7FB" stroke="#DDE5EF"/>
  <text x="30" y="270" font-size="11" fill="#8A9BB0">基础设施层（Docker 容器 · docker-compose 一键启动）</text>

  <!-- MySQL -->
  <rect x="30" y="288" width="130" height="64" rx="8" fill="#EEEDFE" stroke="#8E7CC3" stroke-width="1.5"/>
  <text x="95" y="312" font-size="14" font-weight="700" fill="#4A3B7A" text-anchor="middle">MySQL 8.4</text>
  <text x="95" y="330" font-size="10" fill="#2C6FB5" text-anchor="middle">业务数据 · :3308</text>

  <!-- Celery Worker -->
  <rect x="175" y="288" width="150" height="64" rx="8" fill="#FAEDA8" stroke="#E0A800" stroke-width="1.5"/>
  <text x="250" y="312" font-size="14" font-weight="700" fill="#6B5300" text-anchor="middle">Celery Worker</text>
  <text x="250" y="330" font-size="10" fill="#2C6FB5" text-anchor="middle">后台慢任务执行</text>

  <!-- Redis -->
  <rect x="360" y="288" width="130" height="64" rx="8" fill="#EEEDFE" stroke="#8E7CC3" stroke-width="1.5"/>
  <text x="425" y="312" font-size="14" font-weight="700" fill="#4A3B7A" text-anchor="middle">Redis 7</text>
  <text x="425" y="330" font-size="10" fill="#2C6FB5" text-anchor="middle">任务队列 Broker · :6379</text>

  <!-- PostgreSQL -->
  <rect x="525" y="288" width="145" height="64" rx="8" fill="#EEEDFE" stroke="#8E7CC3" stroke-width="1.5"/>
  <text x="597" y="312" font-size="14" font-weight="700" fill="#4A3B7A" text-anchor="middle">PostgreSQL 16</text>
  <text x="597" y="330" font-size="10" fill="#2C6FB5" text-anchor="middle">Agent 检查点 · :5433</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5A7A99"/>
    </marker>
  </defs>

  <!-- 浏览器 → 前端 -->
  <line x1="150" y1="89" x2="173" y2="89" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- 前端 → FastAPI -->
  <line x1="325" y1="89" x2="358" y2="89" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="341" y="82" font-size="9" fill="#2C6FB5" text-anchor="middle">fetch/JSON</text>
  <!-- FastAPI → 模型供应商 -->
  <line x1="495" y1="89" x2="543" y2="89" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="519" y="82" font-size="9" fill="#2C6FB5" text-anchor="middle">LLM API</text>

  <!-- FastAPI → MySQL -->
  <path d="M427,120 V205 H95 V286" fill="none" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="235" y="200" font-size="9" fill="#2C6FB5" text-anchor="middle">业务数据读写</text>

  <!-- FastAPI → Redis -->
  <path d="M427,120 V255 H425 V286" fill="none" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="300" y="250" font-size="9" fill="#2C6FB5" text-anchor="middle">任务入队</text>

  <!-- Redis → Worker -->
  <line x1="360" y1="320" x2="327" y2="320" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="343" y="314" font-size="9" fill="#2C6FB5" text-anchor="middle">取任务</text>

  <!-- Worker → PostgreSQL -->
  <line x1="323" y1="320" x2="523" y2="320" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="423" y="314" font-size="9" fill="#2C6FB5" text-anchor="middle">写入检查点</text>
</svg>
