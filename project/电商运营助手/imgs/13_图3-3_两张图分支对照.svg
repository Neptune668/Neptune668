<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 364" width="680" height="364">
<rect width="680" height="364" fill="#FFFFFF"/>
<rect x="30" y="24" width="300" height="40" rx="8" fill="#E6F1FB"/>
<rect x="36" y="30" width="288" height="28" rx="6" fill="#FFFFFF"/>
<text x="50" y="50" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1F2937" font-weight="bold">商品基础图 graph.py</text>
<rect x="30" y="76" width="300" height="56" rx="8" fill="#FAEDA8"/>
<rect x="36" y="82" width="288" height="44" rx="6" fill="#FFFFFF"/>
<text x="50" y="98" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">质量不通过</text>
<text x="50" y="116" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">有剩余次数则返修</text>
<rect x="30" y="148" width="300" height="56" rx="8" fill="#EEEDFE"/>
<rect x="36" y="154" width="288" height="44" rx="6" fill="#FFFFFF"/>
<text x="50" y="170" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">完成质量阶段后</text>
<text x="50" y="188" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">统一进入人工审核</text>
<path d="M 180 116 L 180 144" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="180,144 176,137 184,137" fill="#7A94AD"/>
<rect x="350" y="24" width="300" height="40" rx="8" fill="#EAF3DE"/>
<rect x="356" y="30" width="288" height="28" rx="6" fill="#FFFFFF"/>
<text x="370" y="50" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1F2937" font-weight="bold">通用平台图 platform_graph.py</text>
<rect x="350" y="76" width="300" height="56" rx="8" fill="#FAECE7"/>
<rect x="356" y="82" width="288" height="44" rx="6" fill="#FFFFFF"/>
<text x="370" y="98" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">质量不通过</text>
<text x="370" y="116" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">进入 quality_failed 结束</text>
<rect x="350" y="148" width="300" height="56" rx="8" fill="#FDEBD0"/>
<rect x="356" y="154" width="288" height="44" rx="6" fill="#FFFFFF"/>
<text x="370" y="170" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">按默认风险级别</text>
<text x="370" y="188" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">仅 R2 / R3 连接审批分支</text>
<path d="M 500 116 L 500 144" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="500,144 496,137 504,137" fill="#7A94AD"/>
<rect x="30" y="236" width="620" height="88" rx="8" fill="#E6F1FB"/>
<rect x="36" y="242" width="608" height="76" rx="6" fill="#FFFFFF"/>
<text x="50" y="262" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">共同点</text>
<text x="50" y="282" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">节点只返回自己负责的增量字段</text>
<text x="50" y="300" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">分支只能落在已注册的节点上</text>
<text x="50" y="348" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">两张图是两套并列入口，不会对同一个任务重复执行</text>
</svg>
