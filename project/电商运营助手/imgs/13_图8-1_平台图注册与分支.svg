<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 462" width="680" height="462">
<rect width="680" height="462" fill="#FFFFFF"/>
<rect x="40" y="24" width="600" height="52" rx="8" fill="#E6F1FB"/>
<rect x="46" y="30" width="588" height="40" rx="6" fill="#FFFFFF"/>
<text x="64" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1F2937" font-weight="bold">load_context</text>
<text x="64" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">读取上下文并初始化 agent_outputs</text>
<rect x="40" y="96" width="600" height="84" rx="8" fill="#EAF3DE"/>
<rect x="46" y="102" width="588" height="72" rx="6" fill="#FFFFFF"/>
<text x="64" y="120" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">按 workflow.agents 循环注册</text>
<text x="64" y="140" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">creative_strategy_agent → content_production_agent → 其他已登记角色</text>
<text x="64" y="160" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">跳过质量角色，每个角色只追加自己的输出键</text>
<path d="M 340 76 L 340 92" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,92 336,85 344,85" fill="#7A94AD"/>
<rect x="40" y="200" width="600" height="52" rx="8" fill="#FAEDA8"/>
<rect x="46" y="206" width="588" height="40" rx="6" fill="#FFFFFF"/>
<text x="64" y="224" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1F2937" font-weight="bold">quality_compliance</text>
<text x="64" y="242" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">调用 evaluate_quality 检查全部输出</text>
<path d="M 340 180 L 340 196" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="340,196 336,189 344,189" fill="#7A94AD"/>
<rect x="40" y="272" width="290" height="64" rx="8" fill="#FDEBD0"/>
<rect x="46" y="278" width="278" height="52" rx="6" fill="#FFFFFF"/>
<text x="60" y="296" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">R2 / R3 工作流</text>
<text x="60" y="316" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">先到 approval_gate 再到 finalize</text>
<rect x="350" y="272" width="290" height="64" rx="8" fill="#EEEDFE"/>
<rect x="356" y="278" width="278" height="52" rx="6" fill="#FFFFFF"/>
<text x="370" y="296" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">R0 / R1 工作流</text>
<text x="370" y="316" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">直接从质量节点到 finalize</text>
<path d="M 340 226 L 185 226 L 185 268" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="185,270 181,263 189,263" fill="#7A94AD"/>
<path d="M 340 226 L 495 226 L 495 268" fill="none" stroke="#7A94AD" stroke-width="1.6"/>
<polygon points="495,270 491,263 499,263" fill="#7A94AD"/>
<rect x="40" y="356" width="600" height="64" rx="8" fill="#FAECE7"/>
<rect x="46" y="362" width="588" height="52" rx="6" fill="#FFFFFF"/>
<text x="64" y="380" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1F2937" font-weight="bold">质量不通过</text>
<text x="64" y="400" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5A7A99" font-weight="normal">两条路径都会落到 quality_failed，标记最终状态后结束</text>
<path d="M 60 252 L 60 312 L 340 312 L 340 352" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4"/>
<polygon points="340,354 336,347 344,347" fill="#94A3B8"/>
<text x="64" y="446" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94A3B8" font-weight="normal">审批节点总是被注册，但只有风险达到 R2 或 R3 的工作流才会连到它</text>
</svg>
