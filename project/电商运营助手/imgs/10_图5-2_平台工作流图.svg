<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/>

  <rect x="230" y="18" width="220" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="242" y="28" width="196" height="28" rx="6" fill="#FFFFFF"/>
  <text x="254" y="47" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">开始</text>

  <rect x="230" y="86" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="242" y="96" width="196" height="36" rx="6" fill="#FFFFFF"/>
  <text x="254" y="111" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">加载上下文节点</text>
  <text x="254" y="128" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">按商品或店铺范围加载</text>

  <rect x="230" y="162" width="220" height="56" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="242" y="172" width="196" height="36" rx="6" fill="#FFFFFF"/>
  <text x="254" y="187" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">领域节点一</text>
  <text x="254" y="204" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">由业务线声明的第一个角色</text>

  <rect x="230" y="230" width="220" height="48" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1" stroke-dasharray="5 3"/>
  <rect x="242" y="238" width="196" height="32" rx="6" fill="#FFFFFF"/>
  <text x="254" y="259" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">中间领域节点（数量不定）</text>

  <rect x="230" y="298" width="220" height="56" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="242" y="308" width="196" height="36" rx="6" fill="#FFFFFF"/>
  <text x="254" y="323" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">质量合规节点</text>
  <text x="254" y="340" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">固定在末尾，检查全部输出</text>

  <rect x="476" y="298" width="180" height="56" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="488" y="308" width="156" height="36" rx="6" fill="#FFFFFF"/>
  <text x="500" y="323" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">质量失败终态</text>
  <text x="500" y="340" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">未通过且不再返修</text>

  <rect x="230" y="374" width="220" height="56" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="242" y="384" width="196" height="36" rx="6" fill="#FFFFFF"/>
  <text x="254" y="399" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">审批门（条件插入）</text>
  <text x="254" y="416" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">仅 R2 与 R3 业务线具备</text>

  <rect x="230" y="450" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="242" y="460" width="196" height="36" rx="6" fill="#FFFFFF"/>
  <text x="254" y="475" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">收尾节点</text>
  <text x="254" y="492" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">写入正式业务对象</text>

  <path d="M 340 66 L 340 86" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,86 336,79 344,79" fill="#7A94AD"/>
  <path d="M 340 142 L 340 162" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,162 336,155 344,155" fill="#7A94AD"/>
  <path d="M 340 218 L 340 230" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,230 336,223 344,223" fill="#7A94AD"/>
  <path d="M 340 278 L 340 298" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,298 336,291 344,291" fill="#7A94AD"/>
  <path d="M 450 326 L 472 326" stroke="#B0917F" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <polygon points="476,326 469,322 469,330" fill="#B0917F"/>
  <path d="M 340 354 L 340 374" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,374 336,367 344,367" fill="#7A94AD"/>
  <path d="M 340 430 L 340 450" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,450 336,443 344,443" fill="#7A94AD"/>

  <path d="M 450 402 L 620 402 L 620 478 L 454 478" stroke="#B0917F" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <polygon points="450,478 457,474 457,482" fill="#B0917F"/>
  <text x="620" y="392" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#B0917F" text-anchor="middle">R0 与 R1 直接收尾</text>

  <text x="466" y="318" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">未通过</text>
  <text x="352" y="368" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">通过</text>

  <rect x="24" y="162" width="176" height="200" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="36" y="174" width="152" height="176" rx="6" fill="#FFFFFF"/>
  <text x="48" y="192" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">四条装配规则</text>
  <text x="48" y="214" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">一、固定加载上下文</text>
  <text x="48" y="234" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">二、按声明顺序串联</text>
  <text x="48" y="254" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">三、质量节点放末尾</text>
  <text x="48" y="274" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">四、按风险插审批门</text>
  <text x="48" y="300" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">加一条业务线不需要</text>
  <text x="48" y="318" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">再写一张图</text>
  <text x="48" y="338" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">只需要在注册表声明</text>
</svg>
