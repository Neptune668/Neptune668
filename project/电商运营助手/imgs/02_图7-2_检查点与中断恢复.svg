<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="300" fill="#F7F9FC"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2D3D">图 7-2　检查点与中断恢复（以同一 thread_id 续跑）</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5B7AA0"/>
    </marker>
  </defs>

  <!-- boxes -->
  <rect x="30" y="110" width="64" height="54" rx="10" fill="#FFFFFF" stroke="#9DB8D6" stroke-width="1.5"/>
  <text x="62" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3D">START</text>

  <rect x="120" y="110" width="86" height="54" rx="10" fill="#E6F1FB" stroke="#5B9BD5" stroke-width="1.5"/>
  <text x="163" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3D">读商品</text>
  <text x="163" y="155" text-anchor="middle" font-size="10" fill="#356088">load_product</text>

  <rect x="226" y="110" width="86" height="54" rx="10" fill="#E6F1FB" stroke="#5B9BD5" stroke-width="1.5"/>
  <text x="269" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3D">诊断</text>
  <text x="269" y="155" text-anchor="middle" font-size="10" fill="#356088">diagnosis</text>

  <rect x="340" y="110" width="120" height="54" rx="10" fill="#FAECE7" stroke="#E57373" stroke-width="1.5"/>
  <text x="400" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#C0392B">⏸ 人工审批</text>
  <text x="400" y="152" text-anchor="middle" font-size="10" fill="#C0392B">interrupt</text>

  <rect x="492" y="110" width="86" height="54" rx="10" fill="#EAF3DE" stroke="#8BC34A" stroke-width="1.5"/>
  <text x="535" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3D">finalize</text>
  <text x="535" y="155" text-anchor="middle" font-size="10" fill="#5A7D2A">落库</text>

  <rect x="600" y="110" width="60" height="54" rx="10" fill="#FFFFFF" stroke="#9DB8D6" stroke-width="1.5"/>
  <text x="630" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3D">END</text>

  <!-- solid arrows -->
  <line x1="94" y1="137" x2="118" y2="137" stroke="#5B7AA0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="206" y1="137" x2="224" y2="137" stroke="#5B7AA0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="312" y1="137" x2="338" y2="137" stroke="#5B7AA0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PostgreSQL checkpoint -->
  <rect x="340" y="200" width="140" height="54" rx="10" fill="#FAEDA8" stroke="#E0B500" stroke-width="1.5"/>
  <text x="410" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3D">PostgreSQL</text>
  <text x="410" y="242" text-anchor="middle" font-size="10" fill="#8A6D00">checkpoint 持久化</text>

  <!-- 人工审批 -> checkpoint (down) -->
  <line x1="400" y1="164" x2="400" y2="198" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="412" y="186" font-size="10" fill="#C0392B">写入状态</text>

  <!-- resume curve 人工审批 -> finalize -->
  <path d="M460,110 C475,70 477,70 492,110" fill="none" stroke="#7E57C2" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="452" y="62" font-size="10" fill="#6A5ACD">Command(resume) 同 thread_id 恢复</text>

  <!-- finalize -> END -->
  <line x1="578" y1="137" x2="598" y2="137" stroke="#5B7AA0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- note -->
  <text x="340" y="288" text-anchor="middle" font-size="11" fill="#5B7AA0">同一 thread_id 才能找到正确 checkpoint，避免把 A 商品的审批结果误给 B 商品</text>
</svg>
