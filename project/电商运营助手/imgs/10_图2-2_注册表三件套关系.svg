<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470">
  <rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>

  <rect x="30" y="24" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="42" y="34" width="156" height="40" rx="6" fill="#FFFFFF"/>
  <text x="54" y="51" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">角色注册表</text>
  <text x="54" y="68" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">9 个角色 + 工具白名单</text>

  <rect x="250" y="24" width="180" height="60" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="262" y="34" width="156" height="40" rx="6" fill="#FFFFFF"/>
  <text x="274" y="51" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">工具注册表</text>
  <text x="274" y="68" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">16 项工具 + R0 到 R3</text>

  <rect x="470" y="24" width="180" height="60" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="482" y="34" width="156" height="40" rx="6" fill="#FFFFFF"/>
  <text x="494" y="51" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">工作流注册表</text>
  <text x="494" y="68" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">7 条业务线 + 角色串链</text>

  <path d="M 210 54 L 246 54" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="250,54 243,50 243,58" fill="#7A94AD"/>
  <text x="228" y="44" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">白名单</text>

  <path d="M 430 54 L 466 54" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="470,54 463,50 463,58" fill="#7A94AD"/>
  <text x="448" y="44" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">被引用</text>

  <path d="M 340 84 L 340 110 L 120 110 L 120 130" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="120,134 116,127 124,127" fill="#7A94AD"/>

  <rect x="30" y="134" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="42" y="144" width="156" height="36" rx="6" fill="#FFFFFF"/>
  <text x="54" y="159" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">执行顺序由此推导</text>
  <text x="54" y="174" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">节点按声明顺序串联</text>

  <rect x="250" y="134" width="180" height="56" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="262" y="144" width="156" height="36" rx="6" fill="#FFFFFF"/>
  <text x="274" y="159" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">风险级别写在工具上</text>
  <text x="274" y="174" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">不由角色单独决定</text>

  <rect x="470" y="134" width="180" height="56" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="482" y="144" width="156" height="36" rx="6" fill="#FFFFFF"/>
  <text x="494" y="159" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">审批要求由风险推导</text>
  <text x="494" y="174" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">R2 与 R3 必须审批</text>

  <path d="M 430 162 L 466 162" stroke="#B0917F" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <polygon points="470,162 463,158 463,166" fill="#B0917F"/>

  <rect x="30" y="228" width="620" height="86" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="44" y="240" width="592" height="62" rx="6" fill="#FFFFFF"/>
  <text x="56" y="258" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">一次判定的完整链条</text>
  <text x="56" y="276" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">角色是否注册 → 工具是否注册 → 工具是否在该角色白名单 → 角色在工作区是什么身份</text>
  <text x="56" y="293" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">→ 是否所有者专用 → 风险级别是否需要审批</text>

  <rect x="30" y="342" width="620" height="106" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="44" y="354" width="592" height="82" rx="6" fill="#FFFFFF"/>
  <text x="56" y="372" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">三条容易记错的规则</text>
  <text x="56" y="392" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">注册了工具不等于可以直接执行，网关里没有适配器会被拒绝</text>
  <text x="56" y="410" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">只读成员只能执行只读级工具，所有者专用工具仅所有者可用</text>
  <text x="56" y="428" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">业务线名称表达方向，不等同于已经接通外部系统</text>
</svg>
