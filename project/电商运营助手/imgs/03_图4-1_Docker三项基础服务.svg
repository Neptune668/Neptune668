<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2d3d">Docker Compose 三项基础服务</text>
  <text x="24" y="54" font-size="12" fill="#2b6cb0">一份 Compose 清单启动三个相互隔离的容器，数据通过 volume 持久化在宿主机</text>

  <!-- 宿主机框 -->
  <rect x="24" y="74" width="300" height="320" rx="10" fill="#F4F7FB" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="44" y="98" font-size="13" font-weight="700" fill="#475569">本机（宿主机）</text>
  <text x="44" y="118" font-size="11" fill="#64748b">通过 127.0.0.1:端口 访问容器</text>

  <!-- 端口标签 -->
  <text x="60" y="160" font-size="11" fill="#2b6cb0">:3306</text>
  <text x="60" y="240" font-size="11" fill="#2b6cb0">:6379</text>
  <text x="60" y="320" font-size="11" fill="#2b6cb0">:5433</text>

  <!-- 端口映射箭头 -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M 300 150 L 336 150" fill="none"/>
    <path d="M 300 230 L 336 230" fill="none"/>
    <path d="M 300 310 L 336 310" fill="none"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="336,150 328,145 328,155" fill="#94a3b8"/>
    <polygon points="336,230 328,225 328,235" fill="#94a3b8"/>
    <polygon points="336,310 328,305 328,315" fill="#94a3b8"/>
  </g>

  <!-- MySQL 卡片 -->
  <rect x="344" y="96" width="312" height="108" rx="10" fill="#E6F1FB" stroke="#9cc2e6"/>
  <text x="364" y="122" font-size="15" font-weight="700" fill="#1f2d3d">MySQL 8.4</text>
  <text x="364" y="144" font-size="11" fill="#334155">image: mysql:8.4</text>
  <text x="364" y="162" font-size="11" fill="#334155">本机 3306 → 容器 3306</text>
  <text x="364" y="186" font-size="11" fill="#2b6cb0">volume: mysql-data 持久化业务库</text>

  <!-- Redis 卡片 -->
  <rect x="344" y="216" width="312" height="108" rx="10" fill="#EAF3DE" stroke="#a9cf8a"/>
  <text x="364" y="242" font-size="15" font-weight="700" fill="#1f2d3d">Redis 7</text>
  <text x="364" y="264" font-size="11" fill="#334155">image: redis:7-alpine</text>
  <text x="364" y="282" font-size="11" fill="#334155">本机 6379 → 容器 6379</text>
  <text x="364" y="306" font-size="11" fill="#2b6cb0">作为 Celery 的 Broker 与结果后端</text>

  <!-- PostgreSQL 卡片 -->
  <rect x="344" y="336" width="312" height="108" rx="10" fill="#EEEDFE" stroke="#b3abec"/>
  <text x="364" y="362" font-size="15" font-weight="700" fill="#1f2d3d">PostgreSQL 16</text>
  <text x="364" y="384" font-size="11" fill="#334155">image: postgres:16-alpine</text>
  <text x="364" y="402" font-size="11" fill="#334155">本机 5433 → 容器 5432</text>
  <text x="364" y="426" font-size="11" fill="#2b6cb0">volume: agent-checkpoint-data 存 Agent 检查点</text>
</svg>
