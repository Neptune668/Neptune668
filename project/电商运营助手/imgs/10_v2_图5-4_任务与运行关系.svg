<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 416" width="680" height="416">
<rect x="0" y="0" width="680" height="416" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">任务与运行的关系</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="24" y="54" width="280" height="118" rx="8" fill="#E6F1FB" stroke="#9CC3E5" stroke-width="1"/><rect x="32" y="61" width="264" height="104" rx="6" fill="#FFFFFF"/><text x="44" y="110.0" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">任务：卖家的业务目标</text><text x="44" y="127.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">业务线 · 标题 · 意图 · 范围 · 风险</text><text x="40" y="116" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">结果摘要 · 版本清单 · 取消时间</text><text x="40" y="142" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F4E79" text-anchor="start">坚果「给这商品做诊断优化」是一个任务</text><rect x="376" y="54" width="280" height="118" rx="8" fill="#EEEDFE" stroke="#C5C3EC" stroke-width="1"/><rect x="384" y="61" width="264" height="104" rx="6" fill="#FFFFFF"/><text x="396" y="110.0" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">运行：某次技术执行实例</text><text x="396" y="127.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">线程标识 · 尝试次数 · 状态 · 预算用量</text><text x="392" y="116" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">草稿 · 质量报告 · 租约与超时</text><text x="392" y="142" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#6D5FB5" text-anchor="start">同一个任务可以有多次运行</text><path d="M 304 96 L 368 96" fill="none" stroke="#1F4E79" stroke-width="1.5"/><polygon points="374,96 367,92 367,100" fill="#1F4E79"/><text x="340" y="88" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F4E79" text-anchor="middle" font-weight="700">一对多</text><path d="M 304 132 L 368 132" fill="none" stroke="#1F4E79" stroke-width="1.5"/><polygon points="374,132 367,128 367,136" fill="#1F4E79"/><rect x="24" y="190" width="204" height="66" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="32" y="197" width="188" height="52" rx="6" fill="#FFFFFF"/><circle cx="46" cy="223.0" r="12" fill="#1F4E79"/><text x="46" y="227.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="66" y="220.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">运行一 · 首次执行</text><text x="66" y="237.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">尝试次数为一，可能停在待审核</text><rect x="238" y="190" width="204" height="66" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="246" y="197" width="188" height="52" rx="6" fill="#FFFFFF"/><circle cx="260" cy="223.0" r="12" fill="#1F4E79"/><text x="260" y="227.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="280" y="220.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">运行二 · 恢复执行</text><text x="280" y="237.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">同一线程标识，收到决定后继续</text><rect x="452" y="190" width="204" height="66" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/><rect x="460" y="197" width="188" height="52" rx="6" fill="#FFFFFF"/><circle cx="474" cy="223.0" r="12" fill="#1F4E79"/><text x="474" y="227.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="494" y="220.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">运行三 · 重试执行</text><text x="494" y="237.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">次数累加，用量账本继续累计</text><rect x="24" y="272" width="632" height="50" rx="6" fill="#F8FAFD" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="292" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start">为什么分两层：目标不会因一次技术失败而消失，重试与恢复只换运行、不重建任务</text><text x="36" y="310" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">界面展示任务进度，排查看运行事件</text><rect x="24" y="332" width="632" height="50" rx="6" fill="#FDEBD0" stroke="#EBC48F" stroke-width="1"/><text x="36" y="352" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">两张表状态同步：运行推进时任务跟随更新</text><text x="36" y="370" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">检查点只管技术恢复，替代不了业务库里的运行事实</text><text x="340" y="402" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="middle" font-weight="700">任务回答「要什么」，运行回答「这次跑得怎么样」</text>
</svg>
