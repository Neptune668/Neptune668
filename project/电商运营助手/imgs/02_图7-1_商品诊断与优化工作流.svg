<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <!-- 白底外框 -->
  <rect x="1" y="1" width="698" height="378" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1.5" rx="10"/>

  <text x="30" y="28" font-size="14" font-weight="700" fill="#33475B">商品诊断与优化工作流（LangGraph 编排）</text>
  <text x="30" y="48" font-size="11" fill="#8A9BB0">本项目重点案例：多 Agent 协作 + 人工审批闸门 + 可恢复状态</text>

  <!-- 节点：读取商品上下文 -->
  <rect x="24" y="120" width="120" height="60" rx="8" fill="#EAF3DE" stroke="#7CB342" stroke-width="1.5"/>
  <text x="84" y="146" font-size="13" font-weight="700" fill="#3E5A1E" text-anchor="middle">读取商品上下文</text>
  <text x="84" y="164" font-size="9" fill="#2C6FB5" text-anchor="middle">product_context</text>

  <!-- 节点：商品诊断 -->
  <rect x="164" y="120" width="120" height="60" rx="8" fill="#EAF3DE" stroke="#7CB342" stroke-width="1.5"/>
  <text x="224" y="146" font-size="13" font-weight="700" fill="#3E5A1E" text-anchor="middle">商品诊断</text>
  <text x="224" y="164" font-size="9" fill="#2C6FB5" text-anchor="middle">diagnosis</text>

  <!-- 节点：创意策略 -->
  <rect x="304" y="120" width="120" height="60" rx="8" fill="#EAF3DE" stroke="#7CB342" stroke-width="1.5"/>
  <text x="364" y="146" font-size="13" font-weight="700" fill="#3E5A1E" text-anchor="middle">创意策略</text>
  <text x="364" y="164" font-size="9" fill="#2C6FB5" text-anchor="middle">creative_strategy</text>

  <!-- 节点：质量审查 -->
  <rect x="444" y="120" width="120" height="60" rx="8" fill="#EAF3DE" stroke="#7CB342" stroke-width="1.5"/>
  <text x="504" y="146" font-size="13" font-weight="700" fill="#3E5A1E" text-anchor="middle">质量审查</text>
  <text x="504" y="164" font-size="9" fill="#2C6FB5" text-anchor="middle">quality_review</text>

  <!-- 节点：人工审批（中断） -->
  <rect x="584" y="120" width="120" height="60" rx="8" fill="#FAECE7" stroke="#E06666" stroke-width="1.8"/>
  <text x="644" y="146" font-size="13" font-weight="700" fill="#8A3B2E" text-anchor="middle">人工审批</text>
  <text x="644" y="164" font-size="9" fill="#C0392B" text-anchor="middle">[interrupt] 等待确认</text>

  <!-- 节点：保存结果 -->
  <rect x="584" y="250" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#8E7CC3" stroke-width="1.5"/>
  <text x="644" y="276" font-size="13" font-weight="700" fill="#4A3B7A" text-anchor="middle">保存结果</text>
  <text x="644" y="294" font-size="9" fill="#2C6FB5" text-anchor="middle">finalize · 落库</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5A7A99"/>
    </marker>
  </defs>

  <!-- 主链路 -->
  <line x1="144" y1="150" x2="162" y2="150" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="284" y1="150" x2="302" y2="150" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="424" y1="150" x2="442" y2="150" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="564" y1="150" x2="582" y2="150" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- 审批 → 保存 -->
  <line x1="644" y1="180" x2="644" y2="248" stroke="#5A7A99" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 返修：质量审查 → 商品诊断 -->
  <path d="M504,180 V212 H224 V180" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="364" y="228" font-size="9" fill="#C0392B" text-anchor="middle">不通过 · 返修</text>
</svg>
