<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" width="680" height="468">
<rect x="0" y="0" width="680" height="468" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">五类边界与五个可靠性目标</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="24" y="52" width="396" height="30" rx="5" fill="#1F4E79"/><text x="36" y="72" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">五类边界：守什么 / 具体阈值</text><rect x="24" y="90" width="396" height="66" rx="5" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="116" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">数据边界</text><text x="110" y="116" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start">看得见什么</text><text x="36" y="137" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">按工作区过滤，商品与店铺越界即拒</text><rect x="24" y="164" width="396" height="66" rx="5" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="190" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">权限边界</text><text x="110" y="190" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start">能用哪个</text><text x="36" y="211" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">白名单不匹配拒，只读成员仅 R0，所有者专用独占</text><rect x="24" y="238" width="396" height="66" rx="5" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="264" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">预算边界</text><text x="110" y="264" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start">能消耗多少</text><text x="36" y="285" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">默认 12000 Token，调用前截断，为零即熔断</text><rect x="24" y="312" width="396" height="66" rx="5" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="338" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">时间边界</text><text x="110" y="338" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start">能执行多久</text><text x="36" y="359" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">租约 5 分钟 / 心跳 60 秒 / 软硬超时 1700、1800 秒</text><rect x="24" y="386" width="396" height="66" rx="5" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="412" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">副作用边界</text><text x="110" y="412" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start">能不能写</text><text x="36" y="433" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">R2 与 R3 必须审批，通过才落库，只接受一次决定</text><rect x="436" y="52" width="220" height="30" rx="5" fill="#1F4E79"/><text x="448" y="72" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">五个可靠性目标（一条链）</text><rect x="436" y="90" width="220" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="444" y="97" width="204" height="34" rx="6" fill="#FFFFFF"/><circle cx="458" cy="114.0" r="12" fill="#1F4E79"/><text x="458" y="118.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="478" y="119.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">幂等 · 重试安全</text><path d="M 546 138 L 546 142" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="546,148 542,141 550,141" fill="#7A94AD"/><rect x="436" y="148" width="220" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="444" y="155" width="204" height="34" rx="6" fill="#FFFFFF"/><circle cx="458" cy="172.0" r="12" fill="#1F4E79"/><text x="458" y="176.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="478" y="177.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">可恢复 · 不丢工作</text><path d="M 546 196 L 546 200" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="546,206 542,199 550,199" fill="#7A94AD"/><rect x="436" y="206" width="220" height="48" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="444" y="213" width="204" height="34" rx="6" fill="#FFFFFF"/><circle cx="458" cy="230.0" r="12" fill="#1F4E79"/><text x="458" y="234.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="478" y="235.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">可观测 · 过程留痕</text><path d="M 546 254 L 546 258" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="546,264 542,257 550,257" fill="#7A94AD"/><rect x="436" y="264" width="220" height="48" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="444" y="271" width="204" height="34" rx="6" fill="#FFFFFF"/><circle cx="458" cy="288.0" r="12" fill="#1F4E79"/><text x="458" y="292.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="478" y="293.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">可审计 · 决定可追溯</text><path d="M 546 312 L 546 316" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="546,322 542,315 550,315" fill="#7A94AD"/><rect x="436" y="322" width="220" height="48" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="444" y="329" width="204" height="34" rx="6" fill="#FFFFFF"/><circle cx="458" cy="346.0" r="12" fill="#1F4E79"/><text x="458" y="350.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="478" y="351.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">可解释 · 知道怎么改</text><text x="24" y="452" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start">预算边界是调用前截断，不是事后统计；坚果诊断申请 2200、创意 3000，都在剩余额度内核定</text>
</svg>
