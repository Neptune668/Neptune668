<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480">
  <rect x="0" y="0" width="680" height="480" fill="#FFFFFF"/>

  <rect x="24" y="20" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="34" y="30" width="160" height="40" rx="6" fill="#FFFFFF"/>
  <text x="114" y="47" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">接口层</text>
  <text x="114" y="64" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">创建任务与运行</text>

  <rect x="250" y="20" width="180" height="60" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="260" y="30" width="160" height="40" rx="6" fill="#FFFFFF"/>
  <text x="340" y="47" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">消息中间件</text>
  <text x="340" y="64" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">三类队列</text>

  <rect x="476" y="20" width="180" height="60" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="486" y="30" width="160" height="40" rx="6" fill="#FFFFFF"/>
  <text x="566" y="47" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">后台 Worker</text>
  <text x="566" y="64" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">认领租约并执行</text>

  <path d="M 204 50 L 246 50" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="250,50 243,46 243,54" fill="#7A94AD"/>
  <path d="M 430 50 L 472 50" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="476,50 469,46 469,54" fill="#7A94AD"/>

  <rect x="476" y="100" width="180" height="76" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="486" y="110" width="160" height="56" rx="6" fill="#FFFFFF"/>
  <text x="566" y="127" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">工具网关</text>
  <text x="566" y="145" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">租约、幂等、角色复核</text>
  <text x="566" y="161" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">再调用已有业务服务</text>

  <path d="M 566 80 L 566 100" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="566,100 562,93 570,93" fill="#7A94AD"/>

  <rect x="250" y="100" width="180" height="76" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="260" y="110" width="160" height="56" rx="6" fill="#FFFFFF"/>
  <text x="340" y="127" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">维护与周期任务</text>
  <text x="340" y="145" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">投递待发消息</text>
  <text x="340" y="161" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">回收到期与超时运行</text>

  <path d="M 430 138 L 472 138" stroke="#B0917F" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <polygon points="476,138 469,134 469,142" fill="#B0917F"/>
  <path d="M 340 80 L 340 100" stroke="#B0917F" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <polygon points="340,100 336,93 344,93" fill="#B0917F"/>

  <rect x="24" y="206" width="290" height="90" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="36" y="218" width="266" height="66" rx="6" fill="#FFFFFF"/>
  <text x="48" y="238" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">业务数据库</text>
  <text x="48" y="258" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">任务、运行、事件、操作、审批、产物</text>
  <text x="48" y="276" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">使用者可见的业务事实，用于审计</text>

  <rect x="366" y="206" width="290" height="90" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="378" y="218" width="266" height="66" rx="6" fill="#FFFFFF"/>
  <text x="390" y="238" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">检查点数据库</text>
  <text x="390" y="258" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">图的中间状态，按线程标识保存</text>
  <text x="390" y="276" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">只用于技术恢复，不用于审计</text>

  <path d="M 566 176 L 566 196 L 511 196 L 511 202" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="511,206 507,199 515,199" fill="#7A94AD"/>
  <path d="M 566 196 L 620 196 L 620 202" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="620,206 616,199 624,199" fill="#7A94AD"/>
  <path d="M 114 80 L 114 202" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="114,206 110,199 118,199" fill="#7A94AD"/>

  <rect x="24" y="322" width="632" height="64" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="36" y="332" width="608" height="44" rx="6" fill="#FFFFFF"/>
  <text x="48" y="350" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">两条写入线彼此独立，缺一不可</text>
  <text x="48" y="368" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">只写业务库：中断后无法从断点继续；只写检查点：事后无法审计</text>

  <rect x="24" y="400" width="632" height="60" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="36" y="410" width="608" height="40" rx="6" fill="#FFFFFF"/>
  <text x="48" y="428" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">队列为什么要分成三类</text>
  <text x="48" y="446" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">运行、工作流与维护的耗时特征不同，混在一条队列里会互相阻塞</text>
</svg>
