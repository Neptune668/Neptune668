<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 546" width="680" height="546">
<rect x="0" y="0" width="680" height="546" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">坚果案例的一次完整执行</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="150" y="44" width="380" height="42" rx="8" fill="#E6F1FB" stroke="#9CC3E5" stroke-width="1"/><rect x="158" y="51" width="364" height="28" rx="6" fill="#FFFFFF"/><text x="170" y="70.0" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">卖家一句话：分析坚果定位，给主图方向，先审核</text><rect x="150" y="100" width="380" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="158" y="107" width="364" height="34" rx="6" fill="#FFFFFF"/><circle cx="172" cy="124.0" r="12" fill="#1F4E79"/><text x="172" y="128.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="192" y="121.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">商品上下文节点</text><text x="192" y="138.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">售价、成本、人群、竞品</text><path d="M 340 148 L 340 150" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,156 336,149 344,149" fill="#7A94AD"/><rect x="150" y="156" width="380" height="48" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/><rect x="158" y="163" width="364" height="34" rx="6" fill="#FFFFFF"/><circle cx="172" cy="180.0" r="12" fill="#1F4E79"/><text x="172" y="184.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="192" y="177.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">诊断节点</text><text x="192" y="194.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">定位、价格带、风险 · 商品策略</text><path d="M 340 204 L 340 206" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,212 336,205 344,205" fill="#7A94AD"/><rect x="150" y="212" width="380" height="48" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="158" y="219" width="364" height="34" rx="6" fill="#FFFFFF"/><circle cx="172" cy="236.0" r="12" fill="#1F4E79"/><text x="172" y="240.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="192" y="233.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">创意策略节点</text><text x="192" y="250.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">几版主图方向与画面提示词</text><path d="M 340 260 L 340 262" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,268 336,261 344,261" fill="#7A94AD"/><rect x="150" y="268" width="380" height="48" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/><rect x="158" y="275" width="364" height="34" rx="6" fill="#FFFFFF"/><circle cx="172" cy="292.0" r="12" fill="#1F4E79"/><text x="172" y="296.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="192" y="289.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">质量合规节点</text><text x="192" y="306.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">数量、差异度、不当承诺</text><path d="M 340 316 L 340 318" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,324 336,317 344,317" fill="#7A94AD"/><rect x="150" y="324" width="380" height="48" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/><rect x="158" y="331" width="364" height="34" rx="6" fill="#FFFFFF"/><circle cx="172" cy="348.0" r="12" fill="#1F4E79"/><text x="172" y="352.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="192" y="345.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">人工审核节点</text><text x="192" y="362.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">暂停，等待卖家拍板</text><path d="M 340 372 L 340 374" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="340,380 336,373 344,373" fill="#7A94AD"/><rect x="150" y="380" width="380" height="48" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="158" y="387" width="364" height="34" rx="6" fill="#FFFFFF"/><circle cx="172" cy="404.0" r="12" fill="#1F4E79"/><text x="172" y="408.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text><text x="192" y="401.0" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">收尾落库节点</text><text x="192" y="418.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">通过则保存，驳回不落库</text><path d="M 530 268 L 556 268" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 556 268 L 556 156" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 556 156 L 538 156" fill="none" stroke="#B45309" stroke-width="1.5"/><polygon points="532,156 539,152 539,160" fill="#B45309"/><text x="562" y="220" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="start" font-weight="700">未通过</text><text x="562" y="234" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="start">且未超上限</text><text x="562" y="248" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#B45309" text-anchor="start">回诊断重跑</text><rect x="24" y="442" width="632" height="46" rx="6" fill="#F8FAFD" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="462" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start" font-weight="700">共享状态逐步填充：</text><text x="36" y="479" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="start">上下文 → 诊断草稿 → 创意方案列表 → 质量报告 → 审核决定 → 采用内容</text><text x="656" y="462" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="end">返修次数与用量同步累加；快照先脱敏再写事件</text><rect x="24" y="498" width="632" height="40" rx="6" fill="#FDEBD0" stroke="#EBC48F" stroke-width="1"/><text x="36" y="515" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#B45309" text-anchor="start" font-weight="700">两条纪律</text><text x="100" y="515" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start">「低糖」不能扩写成「无糖」「保证减肥」，自动检查只是辅助</text><text x="36" y="531" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="start">批准采用的主图方向仍是文字方案，真出图继续走后台生成任务</text>
</svg>
