<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" width="680" height="396">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="396" fill="#FFFFFF"/>

  <rect x="230" y="30" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="242" y="36" width="196" height="32" rx="6" fill="#FFFFFF"/>
  <text x="340" y="58" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">create_agent_task()</text>
  <path d="M 340 74 L 340 92" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="110" y="96" width="460" height="240" rx="16" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="126" y="116" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">同一个数据库会话里的三段写入</text>

  <rect x="126" y="124" width="428" height="56" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="138" y="130" width="404" height="44" rx="6" fill="#FFFFFF"/>
  <text x="150" y="148" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">第一段 任务记录</text>
  <text x="150" y="166" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">长期目标 · 业务线键与版本 · 脱敏后的上下文 · 版本清单</text>

  <rect x="126" y="190" width="428" height="56" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="138" y="196" width="404" height="44" rx="6" fill="#FFFFFF"/>
  <text x="150" y="214" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">第二段 运行记录</text>
  <text x="150" y="232" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">线程标识 · 队列名 · 预算一万二 · 返修上限一 · 超时三十分钟</text>

  <rect x="126" y="256" width="428" height="56" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="138" y="262" width="404" height="44" rx="6" fill="#FFFFFF"/>
  <text x="150" y="280" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">第三段 待投递消息</text>
  <text x="150" y="298" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">幂等键 agent-run:运行编号:start · 状态为待投递</text>

  <text x="340" y="356" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">三段都只是 flush，真正生效要等调用方发起提交</text>
  <text x="340" y="376" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">调用方不提交则三条记录一行都不存在；提交之后它们同生共死</text>
</svg>
