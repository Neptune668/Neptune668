<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424">
<rect x="0" y="0" width="680" height="424" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">平台工作流图（注册表动态装配）</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="24" y="60" width="100" height="68" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="32" y="67" width="84" height="54" rx="6" fill="#FFFFFF"/><text x="44" y="91.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">加载上下文</text><text x="44" y="108.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">按范围加载</text><path d="M 124 94 L 128 94" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="134,94 127,90 127,98" fill="#7A94AD"/><rect x="134" y="60" width="100" height="68" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/><rect x="142" y="67" width="84" height="54" rx="6" fill="#FFFFFF"/><text x="154" y="91.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">领域节点一</text><text x="154" y="108.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">首个 Agent</text><path d="M 234 94 L 238 94" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="244,94 237,90 237,98" fill="#7A94AD"/><rect x="244" y="60" width="100" height="68" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/><rect x="252" y="67" width="84" height="54" rx="6" fill="#FFFFFF"/><text x="264" y="91.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">… 领域节点</text><text x="264" y="108.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">数量不固定</text><path d="M 344 94 L 348 94" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="354,94 347,90 347,98" fill="#7A94AD"/><rect x="354" y="60" width="100" height="68" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/><rect x="362" y="67" width="84" height="54" rx="6" fill="#FFFFFF"/><text x="374" y="91.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">质量合规</text><text x="374" y="108.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">末尾查全部</text><path d="M 454 94 L 458 94" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="464,94 457,90 457,98" fill="#7A94AD"/><rect x="464" y="60" width="100" height="68" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/><rect x="472" y="67" width="84" height="54" rx="6" fill="#FFFFFF"/><text x="484" y="91.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">审批门</text><text x="484" y="108.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">R2/R3 才有</text><path d="M 564 94 L 568 94" fill="none" stroke="#7A94AD" stroke-width="1.5"/><polygon points="574,94 567,90 567,98" fill="#7A94AD"/><rect x="574" y="60" width="100" height="68" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="582" y="67" width="84" height="54" rx="6" fill="#FFFFFF"/><text x="594" y="91.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">收尾节点</text><text x="594" y="108.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">写正式对象</text><path d="M 384 128 L 384 152" fill="none" stroke="#B45309" stroke-width="1.5"/><polygon points="384,158 380,151 388,151" fill="#B45309"/><rect x="316" y="158" width="136" height="46" rx="8" fill="#FAECE7" stroke="#E7B9AB" stroke-width="1"/><rect x="324" y="165" width="120" height="32" rx="6" fill="#FFFFFF"/><text x="336" y="178.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">质量失败终态</text><text x="336" y="195.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">未通过且不再返修</text><text x="520" y="150" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">R0 / R1 直接由质量连收尾</text><text x="520" y="168" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">不插入审批门</text><text x="24" y="226" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">四条装配规则</text><rect x="24" y="238" width="312" height="54" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="32" y="245" width="296" height="40" rx="6" fill="#FFFFFF"/><circle cx="46" cy="265.0" r="12" fill="#1F4E79"/><text x="46" y="269.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="66" y="262.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">一、固定加载上下文</text><text x="66" y="279.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">按商品或店铺范围加载</text><rect x="346" y="238" width="312" height="54" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="354" y="245" width="296" height="40" rx="6" fill="#FFFFFF"/><circle cx="368" cy="265.0" r="12" fill="#1F4E79"/><text x="368" y="269.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="388" y="262.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">二、按声明顺序串联</text><text x="388" y="279.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">质量合规跳过，固定末尾</text><rect x="24" y="300" width="312" height="54" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/><rect x="32" y="307" width="296" height="40" rx="6" fill="#FFFFFF"/><circle cx="46" cy="327.0" r="12" fill="#1F4E79"/><text x="46" y="331.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="66" y="324.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">三、质量节点放末尾</text><text x="66" y="341.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">检查全部领域输出</text><rect x="346" y="300" width="312" height="54" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><rect x="354" y="307" width="296" height="40" rx="6" fill="#FFFFFF"/><circle cx="368" cy="327.0" r="12" fill="#1F4E79"/><text x="368" y="331.0" font-family="Inter, Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="388" y="324.0" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="start" font-weight="700">四、按风险插审批门</text><text x="388" y="341.0" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">R2 与 R3 才有</text><rect x="24" y="370" width="632" height="44" rx="6" fill="#FDEBD0" stroke="#EBC48F" stroke-width="1"/><text x="340" y="388" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#B45309" text-anchor="middle" font-weight="700">加一条业务线不用再写一张图</text><text x="340" y="405" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="middle">节点数量、顺序、插不插审批门，全部由注册表声明推导</text>
</svg>
