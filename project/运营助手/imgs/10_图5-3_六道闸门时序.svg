<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <rect x="0" y="0" width="680" height="420" fill="#FFFFFF"/>

  <text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">一次运行的时间轴</text>
  <text x="24" y="46" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">从左到右依次穿过六道闸门，任一闸门不通过都停在明确状态</text>

  <path d="M 24 62 L 656 62" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="656,62 649,58 649,66" fill="#7A94AD"/>

  <rect x="24" y="76" width="88" height="96" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="32" y="84" width="72" height="80" rx="6" fill="#FFFFFF"/>
  <text x="68" y="102" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">一</text>
  <text x="68" y="120" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">租约认领</text>
  <text x="68" y="140" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">租约模块</text>
  <text x="68" y="156" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">运行前</text>

  <rect x="126" y="76" width="88" height="96" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="134" y="84" width="72" height="80" rx="6" fill="#FFFFFF"/>
  <text x="170" y="102" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">二</text>
  <text x="170" y="120" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">幂等操作键</text>
  <text x="170" y="140" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">工具网关</text>
  <text x="170" y="156" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">每次调用前</text>

  <rect x="228" y="76" width="88" height="96" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="236" y="84" width="72" height="80" rx="6" fill="#FFFFFF"/>
  <text x="272" y="102" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">三</text>
  <text x="272" y="120" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">预算扣减</text>
  <text x="272" y="140" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">Harness</text>
  <text x="272" y="156" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">调用模型前</text>

  <rect x="330" y="76" width="88" height="96" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="338" y="84" width="72" height="80" rx="6" fill="#FFFFFF"/>
  <text x="374" y="102" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">四</text>
  <text x="374" y="120" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">超时与维护</text>
  <text x="374" y="140" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">维护模块</text>
  <text x="374" y="156" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">运行期间</text>

  <rect x="432" y="76" width="88" height="96" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="440" y="84" width="72" height="80" rx="6" fill="#FFFFFF"/>
  <text x="476" y="102" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">五</text>
  <text x="476" y="120" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">审批门</text>
  <text x="476" y="140" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">任务服务</text>
  <text x="476" y="156" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">落库之前</text>

  <rect x="534" y="76" width="88" height="96" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="542" y="84" width="72" height="80" rx="6" fill="#FFFFFF"/>
  <text x="578" y="102" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">六</text>
  <text x="578" y="120" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">检查点恢复</text>
  <text x="578" y="140" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">持久化模块</text>
  <text x="578" y="156" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">暂停之后</text>

  <rect x="24" y="192" width="88" height="80" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="32" y="200" width="72" height="64" rx="6" fill="#FFFFFF"/>
  <text x="68" y="218" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle">防住</text>
  <text x="68" y="236" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">两个 Worker</text>
  <text x="68" y="254" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">同时执行</text>

  <rect x="126" y="192" width="88" height="80" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="134" y="200" width="72" height="64" rx="6" fill="#FFFFFF"/>
  <text x="170" y="218" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle">防住</text>
  <text x="170" y="236" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">重试或重投</text>
  <text x="170" y="254" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">重复副作用</text>

  <rect x="228" y="192" width="88" height="80" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="236" y="200" width="72" height="64" rx="6" fill="#FFFFFF"/>
  <text x="272" y="218" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle">防住</text>
  <text x="272" y="236" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">多轮调用</text>
  <text x="272" y="254" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">超出预算</text>

  <rect x="330" y="192" width="88" height="80" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="338" y="200" width="72" height="64" rx="6" fill="#FFFFFF"/>
  <text x="374" y="218" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle">防住</text>
  <text x="374" y="236" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">崩溃或超时</text>
  <text x="374" y="254" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">长期占用</text>

  <rect x="432" y="192" width="88" height="80" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="440" y="200" width="72" height="64" rx="6" fill="#FFFFFF"/>
  <text x="476" y="218" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle">防住</text>
  <text x="476" y="236" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">未确认就</text>
  <text x="476" y="254" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">写入正式对象</text>

  <rect x="534" y="192" width="88" height="80" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="542" y="200" width="72" height="64" rx="6" fill="#FFFFFF"/>
  <text x="578" y="218" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937" text-anchor="middle">防住</text>
  <text x="578" y="236" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">中断后</text>
  <text x="578" y="254" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">从头重跑</text>

  <rect x="24" y="300" width="632" height="100" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="38" y="312" width="604" height="76" rx="6" fill="#FFFFFF"/>
  <text x="50" y="330" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">三道闸门都在防重复，但不是冗余</text>
  <text x="50" y="350" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">租约防的是并发重复，重复来源是两个 Worker 同时认领</text>
  <text x="50" y="368" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">幂等键防的是重放重复，重复来源是队列把同一条消息又投了一次</text>
  <text x="50" y="386" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">检查点恢复防的是重跑重复，重复来源是中断后节点从头执行</text>
</svg>
