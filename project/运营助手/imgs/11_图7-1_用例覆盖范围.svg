<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480">
  <rect x="0" y="0" width="680" height="480" fill="#FFFFFF"/>
  <rect x="40" y="24" width="300" height="76" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="34" width="276" height="56" rx="6" fill="#FFFFFF"/>
  <text x="64" y="52" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937">test_foundation_import_and_allowed_tool</text>
  <text x="64" y="70" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">包能被导入、白名单内调用不报错</text>
  <text x="64" y="84" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">状态字典可按类型标注读写</text>
  <rect x="40" y="110" width="300" height="76" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="120" width="276" height="56" rx="6" fill="#FFFFFF"/>
  <text x="64" y="138" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937">test_forbidden_tool_is_rejected</text>
  <text x="64" y="156" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">环节请求不属于自己的工具时被拒绝</text>
  <rect x="40" y="196" width="300" height="76" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="206" width="276" height="56" rx="6" fill="#FFFFFF"/>
  <text x="64" y="224" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937">test_unknown_agent_is_rejected</text>
  <text x="64" y="242" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">环节名未在白名单登记时同样被拒绝</text>
  <rect x="40" y="282" width="300" height="76" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="292" width="276" height="56" rx="6" fill="#FFFFFF"/>
  <text x="64" y="310" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937">test_snapshot_redacts_nested_secrets</text>
  <text x="64" y="328" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">嵌套字典里的敏感字段被替换成标记</text>
  <rect x="440" y="24" width="200" height="84" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="452" y="34" width="176" height="64" rx="6" fill="#FFFFFF"/>
  <text x="462" y="56" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">contracts.py</text>
  <text x="462" y="74" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">AgentWorkflowState</text>
  <text x="462" y="90" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">共享状态的键集合描述</text>
  <rect x="440" y="118" width="200" height="108" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="452" y="128" width="176" height="88" rx="6" fill="#FFFFFF"/>
  <text x="462" y="150" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">definitions.py</text>
  <text x="462" y="168" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">+ policy.py 提供校验入口</text>
  <text x="462" y="186" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">require_tool_permission()</text>
  <text x="462" y="204" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">放行、越权、未知环节</text>
  <rect x="440" y="244" width="200" height="104" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="452" y="254" width="176" height="84" rx="6" fill="#FFFFFF"/>
  <text x="462" y="276" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">harness.py</text>
  <text x="462" y="296" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">redact_snapshot()</text>
  <text x="462" y="314" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">嵌套字典里的敏感字段</text>
  <text x="462" y="332" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">值被替换为 [redacted]</text>
  <path d="M 340 60 L 432 60" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="440,60 433,56 433,64" fill="#7A94AD"/>
  <path d="M 340 68 L 388 68 L 388 150 L 432 150" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="440,150 433,146 433,154" fill="#7A94AD"/>
  <path d="M 340 146 L 410 146 L 410 175 L 432 175" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="440,175 433,171 433,179" fill="#7A94AD"/>
  <path d="M 340 232 L 420 232 L 420 200 L 432 200" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="440,200 433,196 433,204" fill="#7A94AD"/>
  <path d="M 340 318 L 388 318 L 388 294 L 432 294" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="440,294 433,290 433,298" fill="#7A94AD"/>
  <rect x="40" y="372" width="600" height="76" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="52" y="382" width="576" height="56" rx="6" fill="#FFFFFF"/>
  <text x="64" y="400" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">第二条与第三条的区别在失败模式</text>
  <text x="64" y="418" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">一个是环节存在但工具不在集合里，一个是环节本身不存在</text>
  <text x="64" y="434" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">两者都走 get(agent_name, frozenset()) 取到空集这条分支</text>
</svg>
