<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480">
  <rect x="0" y="0" width="680" height="480" fill="#FFFFFF"/>

  <rect x="40" y="24" width="380" height="56" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="34" width="352" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="49" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">上游环节把结果写进共享状态</text>
  <text x="64" y="64" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">形状未知：字段名可能漂移、值可能为空、条数可能不足</text>

  <rect x="40" y="108" width="380" height="56" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="118" width="352" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="133" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">第一道检查 数据合同</text>
  <text x="64" y="148" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">额外字段、空字符串、条数越界、组合矛盾 全部拒收</text>

  <rect x="40" y="192" width="380" height="56" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="202" width="352" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="217" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">环节拿到合法数据，准备动手</text>
  <text x="64" y="232" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">数据合法只说明能读，不代表有权限调用任何一个工具</text>

  <rect x="40" y="276" width="380" height="56" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="286" width="352" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="301" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">第二道检查 工具边界</text>
  <text x="64" y="316" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">工具名不在不可变白名单集合中，抛出策略异常并中断</text>

  <rect x="40" y="360" width="380" height="56" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="54" y="370" width="352" height="36" rx="6" fill="#FFFFFF"/>
  <text x="64" y="385" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">工具执行，结果写回共享状态</text>
  <text x="64" y="400" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">整个过程被脱敏记录，并扣减本次模型用量</text>

  <rect x="450" y="24" width="190" height="120" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="462" y="36" width="166" height="96" rx="6" fill="#FFFFFF"/>
  <text x="472" y="56" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">数据合同管的是传递</text>
  <text x="472" y="76" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">约束 in-out 的形状</text>
  <text x="472" y="96" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">由 Pydantic 模型承担</text>
  <text x="472" y="116" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">不关心谁来执行</text>

  <rect x="450" y="192" width="190" height="140" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="462" y="204" width="166" height="116" rx="6" fill="#FFFFFF"/>
  <text x="472" y="224" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">工具边界管的是动作</text>
  <text x="472" y="244" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">约束每个环节能调用什么</text>
  <text x="472" y="264" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">由不可变集合承担</text>
  <text x="472" y="284" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">不关心数据内容</text>
  <text x="472" y="304" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">两者互相不可替代</text>

  <rect x="450" y="360" width="190" height="90" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="462" y="372" width="166" height="66" rx="6" fill="#FFFFFF"/>
  <text x="472" y="392" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">任一道未通过即中断</text>
  <text x="472" y="412" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">不做降级放行</text>
  <text x="472" y="430" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">异常携带定位信息</text>

  <path d="M 230 80 L 230 104" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="230,108 226,101 234,101" fill="#7A94AD"/>
  <path d="M 230 164 L 230 188" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="230,192 226,185 234,185" fill="#7A94AD"/>
  <path d="M 230 248 L 230 272" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="230,276 226,269 234,269" fill="#7A94AD"/>
  <path d="M 230 332 L 230 356" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="230,360 226,353 234,353" fill="#7A94AD"/>

  <path d="M 420 60 L 446 60" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
  <path d="M 420 220 L 446 220" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
  <path d="M 420 400 L 446 400" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
</svg>
