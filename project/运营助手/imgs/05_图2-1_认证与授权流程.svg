<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 996" width="680" height="996" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A94AD"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C0563C"/>
    </marker>
  </defs>
  <rect width="680" height="996" fill="#FFFFFF"/>

  <!-- n1 客户端 -->
  <rect x="150" y="20" width="380" height="58" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <text x="340" y="45" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">客户端 / Swagger</text>
  <text x="340" y="64" text-anchor="middle" font-size="11" fill="#2563EB">提交 email + password</text>
  <line x1="340" y1="78" x2="340" y2="108" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- n2 登录接口 -->
  <rect x="150" y="110" width="380" height="58" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <text x="340" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">POST /api/v1/auth/login</text>
  <text x="340" y="154" text-anchor="middle" font-size="11" fill="#2563EB">请求体由 LoginRequest 校验字段</text>
  <line x1="340" y1="168" x2="340" y2="198" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- n3 路由查询用户 -->
  <rect x="150" y="200" width="380" height="58" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <text x="340" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">路由 auth.login</text>
  <text x="340" y="244" text-anchor="middle" font-size="11" fill="#2563EB">按邮箱查询 User 记录</text>
  <line x1="340" y1="258" x2="340" y2="288" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- n4 校验密码 -->
  <rect x="150" y="290" width="380" height="58" rx="8" fill="#EAF3DE" stroke="#A8CE8F"/>
  <text x="340" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">verify_password</text>
  <text x="340" y="334" text-anchor="middle" font-size="11" fill="#2563EB">pbkdf2_sha256 摘要校验，常量时间比较</text>
  <line x1="530" y1="319" x2="543" y2="319" stroke="#C0563C" stroke-width="1.5" marker-end="url(#arRed)"/>
  <rect x="545" y="290" width="125" height="58" rx="8" fill="#FAECE7" stroke="#E8A79A"/>
  <text x="607" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#8A3320">401</text>
  <text x="607" y="334" text-anchor="middle" font-size="10" fill="#8A3320">邮箱或密码错误</text>
  <line x1="340" y1="348" x2="340" y2="378" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- n5 校验账号状态 -->
  <rect x="150" y="380" width="380" height="58" rx="8" fill="#EAF3DE" stroke="#A8CE8F"/>
  <text x="340" y="405" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">ensure_user_can_login</text>
  <text x="340" y="424" text-anchor="middle" font-size="11" fill="#2563EB">status 必须为 ACTIVE</text>
  <line x1="530" y1="409" x2="543" y2="409" stroke="#C0563C" stroke-width="1.5" marker-end="url(#arRed)"/>
  <rect x="545" y="380" width="125" height="58" rx="8" fill="#FAECE7" stroke="#E8A79A"/>
  <text x="607" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#8A3320">403</text>
  <text x="607" y="424" text-anchor="middle" font-size="10" fill="#8A3320">账号已停用</text>
  <line x1="340" y1="438" x2="340" y2="468" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- n6 签发 Token -->
  <rect x="150" y="470" width="380" height="58" rx="8" fill="#FAEDA8" stroke="#E0C96A"/>
  <text x="340" y="495" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">create_access_token</text>
  <text x="340" y="514" text-anchor="middle" font-size="11" fill="#2563EB">payload：sub / email / role / exp，HMAC-SHA256 签名</text>
  <line x1="340" y1="528" x2="340" y2="558" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- n7 返回 -->
  <rect x="150" y="560" width="380" height="58" rx="8" fill="#FAEDA8" stroke="#E0C96A"/>
  <text x="340" y="585" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">返回 AuthTokenRead</text>
  <text x="340" y="604" text-anchor="middle" font-size="11" fill="#2563EB">access_token / bearer / user，不含 password_hash</text>
  <line x1="340" y1="618" x2="340" y2="648" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- n8 受保护请求 -->
  <rect x="150" y="650" width="380" height="58" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <text x="340" y="675" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">受保护业务请求</text>
  <text x="340" y="694" text-anchor="middle" font-size="11" fill="#2563EB">请求头 Authorization: Bearer &lt;token&gt;</text>
  <line x1="340" y1="708" x2="340" y2="738" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- n9 解析 Token -->
  <rect x="150" y="740" width="380" height="58" rx="8" fill="#EEEDFE" stroke="#B3AFE6"/>
  <text x="340" y="765" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">依赖 get_current_user</text>
  <text x="340" y="784" text-anchor="middle" font-size="11" fill="#2563EB">解析 Token → 校验签名与 exp → 回查数据库用户状态</text>
  <line x1="340" y1="798" x2="340" y2="828" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- n10 权限映射 -->
  <rect x="150" y="830" width="380" height="58" rx="8" fill="#EEEDFE" stroke="#B3AFE6"/>
  <text x="340" y="855" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">ROLE_PERMISSIONS 权限映射</text>
  <text x="340" y="874" text-anchor="middle" font-size="11" fill="#2563EB">owner 全权限 / operator 可编辑 / viewer 只读</text>

  <!-- 分支 -->
  <line x1="340" y1="888" x2="340" y2="904" stroke="#7A94AD" stroke-width="1.5"/>
  <line x1="140" y1="904" x2="540" y2="904" stroke="#7A94AD" stroke-width="1.5"/>
  <line x1="140" y1="904" x2="140" y2="918" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="340" y1="904" x2="340" y2="918" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="540" y1="904" x2="540" y2="918" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="50" y="920" width="180" height="58" rx="8" fill="#EAF3DE" stroke="#A8CE8F"/>
  <text x="140" y="945" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">允许查看</text>
  <text x="140" y="964" text-anchor="middle" font-size="11" fill="#2563EB">can_read = True</text>

  <rect x="250" y="920" width="180" height="58" rx="8" fill="#EAF3DE" stroke="#A8CE8F"/>
  <text x="340" y="945" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">允许编辑</text>
  <text x="340" y="964" text-anchor="middle" font-size="11" fill="#2563EB">can_edit = True</text>

  <rect x="450" y="920" width="180" height="58" rx="8" fill="#FAECE7" stroke="#E8A79A"/>
  <text x="540" y="945" text-anchor="middle" font-size="14" font-weight="bold" fill="#8A3320">拒绝访问</text>
  <text x="540" y="964" text-anchor="middle" font-size="11" fill="#8A3320">403 权限不足</text>
</svg>
