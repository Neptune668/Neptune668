<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/>

  <rect x="24" y="20" width="632" height="480" rx="10" fill="#FAECE7" fill-opacity="0.35" stroke="#C9D6E5" stroke-width="1"/>
  <text x="40" y="42" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">边界之外：模型供应商与外部系统</text>

  <rect x="56" y="56" width="568" height="424" rx="10" fill="#FDEBD0" fill-opacity="0.4" stroke="#C9D6E5" stroke-width="1"/>
  <text x="72" y="78" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">第五层：副作用边界</text>
  <text x="72" y="96" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">写入正式业务对象必须经人工审批，同一运行只接受一次最终决定</text>

  <rect x="88" y="108" width="504" height="360" rx="10" fill="#EAF3DE" fill-opacity="0.45" stroke="#C9D6E5" stroke-width="1"/>
  <text x="104" y="130" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">第四层：时间边界</text>
  <text x="104" y="148" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">租约五分钟、心跳六十秒、软硬超时 1700 与 1800 秒，到期由维护回收</text>

  <rect x="120" y="160" width="440" height="296" rx="10" fill="#FAEDA8" fill-opacity="0.45" stroke="#C9D6E5" stroke-width="1"/>
  <text x="136" y="182" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">第三层：预算边界</text>
  <text x="136" y="200" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">总预算一万二千 Token，调用前截断，耗尽即熔断本次运行</text>

  <rect x="152" y="212" width="376" height="228" rx="10" fill="#EEEDFE" fill-opacity="0.5" stroke="#C9D6E5" stroke-width="1"/>
  <text x="168" y="234" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">第二层：权限边界</text>
  <text x="168" y="252" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">角色白名单、工作区身份、所有者专用、风险级别</text>

  <rect x="184" y="264" width="312" height="152" rx="10" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <text x="200" y="286" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">第一层：结构边界</text>
  <text x="200" y="304" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">只交换定义过的结构，多余字段直接拒绝</text>

  <rect x="248" y="318" width="184" height="72" rx="8" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/>
  <text x="340" y="342" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">Agent 节点</text>
  <text x="340" y="360" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">负责做什么</text>
  <text x="340" y="377" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">不负责能做什么</text>

  <text x="340" y="446" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">Harness 负责「在什么范围内做」</text>
  <text x="340" y="466" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">任何一次对外访问都必须穿过全部五层</text>
  <text x="340" y="486" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99" text-anchor="middle">穿不过去就不是被禁止，而是根本不会发生</text>
</svg>
