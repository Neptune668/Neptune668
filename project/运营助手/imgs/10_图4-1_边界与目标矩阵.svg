<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470">
  <rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>

  <rect x="24" y="20" width="150" height="30" rx="6" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <text x="99" y="40" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">五类边界</text>

  <rect x="190" y="20" width="110" height="30" rx="6" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <text x="245" y="40" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">守什么</text>

  <rect x="316" y="20" width="338" height="30" rx="6" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <text x="485" y="40" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">工程里的阈值或规则</text>

  <rect x="24" y="56" width="150" height="60" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="34" y="66" width="130" height="40" rx="6" fill="#FFFFFF"/>
  <text x="99" y="90" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">数据边界</text>

  <rect x="190" y="56" width="110" height="60" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <text x="245" y="90" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">看得见什么</text>

  <rect x="316" y="56" width="338" height="60" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="326" y="66" width="318" height="40" rx="6" fill="#FFFFFF"/>
  <text x="338" y="82" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">按工作区过滤，商品与店铺作用域越界拒绝</text>
  <text x="338" y="99" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">上下文只加载被声明范围的数据</text>

  <rect x="24" y="126" width="150" height="60" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="34" y="136" width="130" height="40" rx="6" fill="#FFFFFF"/>
  <text x="99" y="160" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">权限边界</text>

  <rect x="190" y="126" width="110" height="60" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <text x="245" y="160" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">能用哪个</text>

  <rect x="316" y="126" width="338" height="60" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="326" y="136" width="318" height="40" rx="6" fill="#FFFFFF"/>
  <text x="338" y="152" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">白名单不匹配拒绝，只读成员只允许只读级</text>
  <text x="338" y="169" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">所有者专用工具仅所有者可用</text>

  <rect x="24" y="196" width="150" height="60" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="34" y="206" width="130" height="40" rx="6" fill="#FFFFFF"/>
  <text x="99" y="230" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">预算边界</text>

  <rect x="190" y="196" width="110" height="60" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <text x="245" y="230" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">能消耗多少</text>

  <rect x="316" y="196" width="338" height="60" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="326" y="206" width="318" height="40" rx="6" fill="#FFFFFF"/>
  <text x="338" y="222" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">默认一万二千 Token，调用前截断</text>
  <text x="338" y="239" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">额度为零直接熔断，不是事后统计</text>

  <rect x="24" y="266" width="150" height="60" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="34" y="276" width="130" height="40" rx="6" fill="#FFFFFF"/>
  <text x="99" y="300" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">时间边界</text>

  <rect x="190" y="266" width="110" height="60" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <text x="245" y="300" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">能执行多久</text>

  <rect x="316" y="266" width="338" height="60" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="326" y="276" width="318" height="40" rx="6" fill="#FFFFFF"/>
  <text x="338" y="292" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">租约五分钟，心跳六十秒</text>
  <text x="338" y="309" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">软硬超时 1700 与 1800 秒，到期回收</text>

  <rect x="24" y="336" width="150" height="60" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="34" y="346" width="130" height="40" rx="6" fill="#FFFFFF"/>
  <text x="99" y="370" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" text-anchor="middle">副作用边界</text>

  <rect x="190" y="336" width="110" height="60" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <text x="245" y="370" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="middle">能不能写</text>

  <rect x="316" y="336" width="338" height="60" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="326" y="346" width="318" height="40" rx="6" fill="#FFFFFF"/>
  <text x="338" y="362" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">R2 与 R3 必须审批，通过才落库</text>
  <text x="338" y="379" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">同一运行只接受一次最终决定</text>

  <rect x="24" y="412" width="630" height="44" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <text x="40" y="431" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">五个可靠性目标</text>
  <text x="40" y="448" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">幂等保证重试安全 → 可恢复保证不丢工作 → 可观测与可审计保证事后能查 → 可解释保证知道怎么改</text>
</svg>
