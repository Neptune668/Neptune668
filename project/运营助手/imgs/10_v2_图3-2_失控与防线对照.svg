<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436">
<rect x="0" y="0" width="680" height="436" rx="0" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1F4E79" text-anchor="start" font-weight="700">四类失控与对应的防线</text>
<rect x="24" y="36" width="632" height="1" rx="0" fill="#9CC3E5"/>
<rect x="24" y="52" width="200" height="30" rx="4" fill="#1F4E79"/><text x="34" y="72" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">四类失控（坚果场景）</text><rect x="232" y="52" width="200" height="30" rx="4" fill="#1F4E79"/><text x="242" y="72" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">对应防线</text><rect x="440" y="52" width="216" height="30" rx="4" fill="#1F4E79"/><text x="450" y="72" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">承担模块</text><rect x="24" y="90" width="200" height="72" rx="5" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="120" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">越界读取</text><text x="36" y="140" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">读到别家竞品数据</text><rect x="232" y="90" width="200" height="72" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><text x="242" y="114" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">按工作区过滤并校验归属，越界直接</text><text x="242" y="130" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">拒绝，不返回部分结果</text><rect x="440" y="90" width="216" height="72" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><text x="452" y="124" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start" font-weight="700">上下文加载 + 工具网关</text><rect x="24" y="170" width="200" height="72" rx="5" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="200" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">无限循环</text><text x="36" y="220" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">质量不过一直返修</text><rect x="232" y="170" width="200" height="72" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><text x="242" y="194" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">返修次数上限，超限交人工；默认一</text><text x="242" y="210" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">次，可配零到三次</text><rect x="440" y="170" width="216" height="72" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><text x="452" y="204" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start" font-weight="700">基础图 + 共享状态</text><rect x="24" y="250" width="200" height="72" rx="5" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="280" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">重复副作用</text><text x="36" y="300" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">重投存了两遍</text><rect x="232" y="250" width="200" height="72" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><text x="242" y="274" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">独占租约加幂等操作键，已完成的操</text><text x="242" y="290" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">作直接返回旧结果</text><rect x="440" y="250" width="216" height="72" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><text x="452" y="284" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start" font-weight="700">租约模块 + 工具网关</text><rect x="24" y="330" width="200" height="72" rx="5" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/><text x="36" y="360" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">成本与不可追溯</text><text x="36" y="380" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5A7A99" text-anchor="start">消耗无人统计、过程不落库</text><rect x="232" y="330" width="200" height="72" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><text x="242" y="354" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">预算熔断、脱敏事件；开始/完成/</text><text x="242" y="370" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1F2937" text-anchor="start">失败三步留痕，含链路标识</text><rect x="440" y="330" width="216" height="72" rx="5" fill="#FFFFFF" stroke="#C9D6E5" stroke-width="1"/><text x="452" y="364" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start" font-weight="700">Harness + 运行服务</text><text x="24" y="416" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start">四类风险都不是模型能力问题，而是工程缺失问题；防线全部落在工程约束上</text>
</svg>
