<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 646" width="680" height="646" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A94AD"/>
    </marker>
  </defs>
  <rect width="680" height="646" fill="#FFFFFF"/>

  <!-- 顶部：请求入口 -->
  <rect x="120" y="14" width="440" height="46" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
  <text x="340" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">客户端 / Swagger</text>
  <text x="340" y="53" text-anchor="middle" font-size="11" fill="#2563EB">所有请求先经过认证，再进入业务模块</text>
  <line x1="340" y1="60" x2="340" y2="86" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 第一行三卡片 -->
  <g>
    <rect x="20" y="90" width="200" height="182" rx="8" fill="#EEEDFE" stroke="#B3AFE6"/>
    <text x="120" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">认证与权限</text>
    <line x1="36" y1="124" x2="204" y2="124" stroke="#C9C4EE"/>
    <text x="36" y="146" font-size="11" fill="#1F3A5F">· POST /auth/login 登录</text>
    <text x="36" y="166" font-size="11" fill="#1F3A5F">· GET /auth/me 当前用户</text>
    <text x="36" y="186" font-size="11" fill="#1F3A5F">· owner / operator / viewer</text>
    <text x="36" y="206" font-size="11" fill="#1F3A5F">· 用户管理 /users</text>
    <text x="36" y="232" font-size="10" fill="#2563EB">Token 签发、校验与角色权限</text>
    <text x="36" y="250" font-size="10" fill="#2563EB">决定「你是谁、能做什么」</text>
  </g>
  <g>
    <rect x="240" y="90" width="200" height="182" rx="8" fill="#E6F1FB" stroke="#9CC3E5"/>
    <text x="340" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">工作区</text>
    <line x1="256" y1="124" x2="424" y2="124" stroke="#B8D4EE"/>
    <text x="256" y="146" font-size="11" fill="#1F3A5F">· 工作区与成员关系</text>
    <text x="256" y="166" font-size="11" fill="#1F3A5F">· CSV 模板下载</text>
    <text x="256" y="186" font-size="11" fill="#1F3A5F">· 商品导入</text>
    <text x="256" y="206" font-size="11" fill="#1F3A5F">· SKU 库存导入</text>
    <text x="256" y="226" font-size="11" fill="#1F3A5F">· 经营数据导入</text>
    <text x="256" y="252" font-size="10" fill="#2563EB">导入分「预览」与「提交」两步</text>
  </g>
  <g>
    <rect x="460" y="90" width="200" height="182" rx="8" fill="#EAF3DE" stroke="#A8CE8F"/>
    <text x="560" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">店铺</text>
    <line x1="476" y1="124" x2="644" y2="124" stroke="#BFDDAE"/>
    <text x="476" y="146" font-size="11" fill="#1F3A5F">· 店铺 CRUD</text>
    <text x="476" y="166" font-size="11" fill="#1F3A5F">· 平台账号与授权状态</text>
    <text x="476" y="186" font-size="11" fill="#1F3A5F">· 库存汇总</text>
    <text x="476" y="206" font-size="11" fill="#1F3A5F">· 库存流水查询</text>
    <text x="476" y="232" font-size="10" fill="#2563EB">店铺是经营主体，商品归属店铺</text>
  </g>

  <!-- 第二行两卡片 -->
  <g>
    <rect x="20" y="300" width="330" height="212" rx="8" fill="#FAEDA8" stroke="#E0C96A"/>
    <text x="185" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">商品中心（核心模块）</text>
    <line x1="36" y1="334" x2="334" y2="334" stroke="#E8D89A"/>
    <text x="36" y="356" font-size="11" fill="#1F3A5F">· 商品 CRUD 与详情聚合</text>
    <text x="36" y="376" font-size="11" fill="#1F3A5F">· SKU 与库存档案</text>
    <text x="36" y="396" font-size="11" fill="#1F3A5F">· 库存流水：出库 / 入库 / 锁定</text>
    <text x="36" y="416" font-size="11" fill="#1F3A5F">· 竞品档案与监控快照</text>
    <text x="36" y="436" font-size="11" fill="#1F3A5F">· 创意方案与素材资料</text>
    <text x="36" y="456" font-size="11" fill="#1F3A5F">· 经营数据 / 投放实验 / 复盘</text>
    <text x="36" y="482" font-size="10" fill="#2563EB">商品是聚合根，其余业务按编号关联</text>
    <text x="36" y="500" font-size="10" fill="#2563EB">库存变动一律走流水，不直接改数量</text>
  </g>
  <g>
    <rect x="370" y="300" width="290" height="212" rx="8" fill="#FDEBD0" stroke="#E8B98A"/>
    <text x="515" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">推广链接</text>
    <line x1="386" y1="334" x2="644" y2="334" stroke="#F0D5B0"/>
    <text x="386" y="356" font-size="11" fill="#1F3A5F">· 推广链接 CRUD</text>
    <text x="386" y="376" font-size="11" fill="#1F3A5F">· 短链跳转 /r/{short_code}</text>
    <text x="386" y="396" font-size="11" fill="#1F3A5F">· 点击计数</text>
    <text x="386" y="416" font-size="11" fill="#1F3A5F">· tracking_code / short_code</text>
    <text x="386" y="442" font-size="10" fill="#2563EB">追踪码与短码由服务端补齐</text>
    <text x="386" y="460" font-size="10" fill="#2563EB">记录来源，不自动建立订单</text>
    <text x="386" y="486" font-size="10" fill="#2563EB">统计只是汇总事实</text>
    <text x="386" y="504" font-size="10" fill="#2563EB">复盘才写解释与下一步行动</text>
  </g>

  <!-- 连接箭头：卡片到数据层 -->
  <line x1="185" y1="512" x2="185" y2="536" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="515" y1="512" x2="515" y2="536" stroke="#7A94AD" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 底部：数据层 -->
  <rect x="20" y="540" width="640" height="92" rx="8" fill="#EAF3DE" stroke="#A8CE8F"/>
  <text x="340" y="564" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">MySQL 业务表（课件四产出的 36 个模型）</text>
  <text x="340" y="588" text-anchor="middle" font-size="11" fill="#1F3A5F">products · stores · product_skus · inventory_items · inventory_movements · competitors</text>
  <text x="340" y="608" text-anchor="middle" font-size="11" fill="#1F3A5F">creative_plans · performance_records · ad_experiments · review_reports · promotion_links</text>
  <text x="340" y="626" text-anchor="middle" font-size="10" fill="#2563EB">前端负责展示与收集，后端负责校验与计算，数据库只保存结果</text>
</svg>
