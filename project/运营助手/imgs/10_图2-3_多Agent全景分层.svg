<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/>

  <text x="24" y="30" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">一次请求的纵向分层</text>

  <rect x="24" y="44" width="632" height="66" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="38" y="54" width="604" height="46" rx="6" fill="#FFFFFF"/>
  <text x="50" y="72" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">接口层：目录、会话、任务、运行、审批、记忆</text>
  <text x="50" y="90" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">只负责接收目标与返回结果，不定义业务规则</text>

  <rect x="24" y="130" width="632" height="66" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="38" y="140" width="604" height="46" rx="6" fill="#FFFFFF"/>
  <text x="50" y="158" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">运行层：任务服务、运行服务、租约服务、维护服务</text>
  <text x="50" y="176" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">认领、事件、状态同步、审批恢复、超时回收</text>

  <rect x="24" y="216" width="632" height="66" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="38" y="226" width="604" height="46" rx="6" fill="#FFFFFF"/>
  <text x="50" y="244" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">编排层：基础工作流图、平台工作流图</text>
  <text x="50" y="262" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">决定节点顺序、分支条件与暂停点，不直接碰数据</text>

  <rect x="24" y="302" width="632" height="66" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="38" y="312" width="604" height="46" rx="6" fill="#FFFFFF"/>
  <text x="50" y="330" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">执行层：Harness 模块、工具网关、专业节点</text>
  <text x="50" y="348" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">脱敏与预算、租约与幂等、模型调用与规则兜底</text>

  <rect x="24" y="388" width="632" height="66" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="38" y="398" width="604" height="46" rx="6" fill="#FFFFFF"/>
  <text x="50" y="416" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">注册与策略层：注册表、策略、节点定义</text>
  <text x="50" y="434" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">九个角色、十六项工具、七条业务线与风险判定</text>

  <rect x="24" y="468" width="632" height="40" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <text x="50" y="493" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">合同层：上下文、草稿、质量报告、事件、共享状态</text>

  <path d="M 340 110 L 340 126" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,130 336,123 344,123" fill="#7A94AD"/>
  <path d="M 340 196 L 340 212" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,216 336,209 344,209" fill="#7A94AD"/>
  <path d="M 340 282 L 340 298" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,302 336,295 344,295" fill="#7A94AD"/>
  <path d="M 340 368 L 340 384" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,388 336,381 344,381" fill="#7A94AD"/>
  <path d="M 340 454 L 340 464" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,468 336,461 344,461" fill="#7A94AD"/>
</svg>
