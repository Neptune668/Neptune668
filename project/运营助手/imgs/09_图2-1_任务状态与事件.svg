<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
  <rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>

  <rect x="30" y="24" width="170" height="40" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="40" y="32" width="150" height="24" rx="6" fill="#FFFFFF"/>
  <text x="48" y="48" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">初次创建 queued</text>

  <rect x="30" y="74" width="170" height="40" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="40" y="82" width="150" height="24" rx="6" fill="#FFFFFF"/>
  <text x="48" y="98" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">自动重试 retry_scheduled</text>

  <rect x="30" y="124" width="170" height="40" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="40" y="132" width="150" height="24" rx="6" fill="#FFFFFF"/>
  <text x="48" y="148" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">人工重试 retry_requested</text>

  <rect x="250" y="24" width="180" height="52" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="260" y="34" width="160" height="32" rx="6" fill="#FFFFFF"/>
  <text x="270" y="49" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">pending 等待执行</text>
  <text x="270" y="64" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">next_run_at 决定最早执行时间</text>

  <rect x="250" y="120" width="180" height="52" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="260" y="130" width="160" height="32" rx="6" fill="#FFFFFF"/>
  <text x="270" y="145" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">running 执行中</text>
  <text x="270" y="160" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">attempts 加 1，写入 started</text>

  <rect x="470" y="120" width="170" height="52" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="480" y="130" width="150" height="32" rx="6" fill="#FFFFFF"/>
  <text x="490" y="145" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">cancelled 已取消</text>
  <text x="490" y="160" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">next_run_at 置空，不再执行</text>

  <rect x="120" y="216" width="170" height="52" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="130" y="226" width="150" height="32" rx="6" fill="#FFFFFF"/>
  <text x="140" y="241" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">succeeded 成功</text>
  <text x="140" y="256" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">result 保存素材字典与 url</text>

  <rect x="330" y="216" width="170" height="52" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="340" y="226" width="150" height="32" rx="6" fill="#FFFFFF"/>
  <text x="350" y="241" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">failed 失败</text>
  <text x="350" y="256" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">error 保存原因摘要</text>

  <rect x="60" y="300" width="560" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="74" y="322" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">未达上限的失败：写 retry_scheduled，回到 pending 并推迟 next_run_at</text>
  <text x="74" y="342" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">退避为 attempts × 2 分钟，最长 10 分钟；达到 max_attempts 后才成为 failed 终态</text>

  <path d="M 200 44 L 246 44" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="248,44 242,40 242,48" fill="#7A94AD"/>
  <path d="M 200 94 L 230 94 L 230 50 L 246 50" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="248,50 242,46 242,54" fill="#7A94AD"/>
  <path d="M 200 144 L 222 144 L 222 60 L 246 60" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="248,60 242,56 242,64" fill="#7A94AD"/>

  <path d="M 340 76 L 340 116" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="340,118 336,111 344,111" fill="#7A94AD"/>

  <path d="M 300 172 L 300 194 L 205 194 L 205 212" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="205,214 201,207 209,207" fill="#7A94AD"/>
  <path d="M 380 172 L 380 194 L 415 194 L 415 212" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="415,214 411,207 419,207" fill="#7A94AD"/>

  <path d="M 430 50 L 555 50 L 555 116" stroke="#B0917F" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <polygon points="555,118 551,111 559,111" fill="#B0917F"/>
  <path d="M 430 146 L 466 146" stroke="#B0917F" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <polygon points="468,146 462,142 462,150" fill="#B0917F"/>
</svg>
