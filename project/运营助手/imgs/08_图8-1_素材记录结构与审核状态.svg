<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
  <rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>

  <!-- 归属 -->
  <rect x="20" y="20" width="390" height="86" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <text x="36" y="42" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">归属字段</text>
  <rect x="36" y="52" width="358" height="44" rx="6" fill="#FFFFFF"/>
  <text x="46" y="70" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">product_id：所属商品</text>
  <text x="46" y="86" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">creative_plan_id：来源方案　generation_job_id：生成任务</text>

  <!-- 素材本体 -->
  <rect x="20" y="116" width="390" height="86" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <text x="36" y="138" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">素材本体字段</text>
  <rect x="36" y="148" width="358" height="44" rx="6" fill="#FFFFFF"/>
  <text x="46" y="166" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">asset_type：image 或 video　title：沿用方案标题　url：本地稳定路径</text>
  <text x="46" y="182" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">model / size / duration：本次生成使用的模型、尺寸与时长</text>

  <!-- 审核 -->
  <rect x="20" y="212" width="390" height="104" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <text x="36" y="234" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">人工审核字段</text>
  <rect x="36" y="244" width="358" height="62" rx="6" fill="#FFFFFF"/>
  <text x="46" y="262" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">status：待评估（默认）→ 已通过 / 已拒绝</text>
  <text x="46" y="278" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">rating：评分　tags：标签　note：备注</text>
  <text x="46" y="294" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">usage_contexts：可用投放场景　asset_version：素材版本</text>

  <!-- 元数据 -->
  <rect x="20" y="326" width="390" height="54" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <text x="36" y="348" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">asset_metadata</text>
  <text x="36" y="368" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">未被提升为列的供应商返回信息原样保留，不参与业务判断</text>

  <!-- 右侧：审核流转 -->
  <text x="432" y="34" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">审核状态流转</text>

  <rect x="432" y="44" width="228" height="40" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <text x="446" y="62" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">待评估（新建素材默认值）</text>
  <text x="446" y="76" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">下载成功不等于可用</text>

  <path d="M 546 84 L 546 108" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="546,112 542,105 550,105" fill="#7A94AD"/>

  <rect x="432" y="112" width="228" height="36" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <text x="446" y="128" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">已通过：可进入投放实验</text>
  <text x="446" y="142" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">同步回创意方案与素材记录</text>

  <rect x="432" y="156" width="228" height="36" rx="8" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <text x="446" y="172" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">已拒绝：不参与投放</text>
  <text x="446" y="186" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">未知状态一律拒绝，不猜测</text>

  <!-- 右侧：去重 -->
  <rect x="432" y="212" width="228" height="148" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <text x="446" y="234" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">按 url 去重</text>
  <text x="446" y="254" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">保存前先查库：</text>
  <text x="446" y="272" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">同一 url 已存在 →</text>
  <text x="446" y="288" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">直接返回既有记录</text>
  <text x="446" y="312" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">避免同一生成结果</text>
  <text x="446" y="328" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">在素材库里重复出现</text>
  <text x="446" y="348" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">计数时才 +1</text>
</svg>
