<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="372" fill="#FFFFFF"/>

  <rect x="230" y="30" width="220" height="48" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="242" y="36" width="196" height="36" rx="6" fill="#FFFFFF"/>
  <text x="340" y="52" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">decide_agent_approval()</text>
  <text x="340" y="68" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">先看审批本身，再看对象，最后看时间</text>

  <path d="M 340 78 L 340 96 L 185 96 L 185 116" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 340 78 L 340 96 L 495 96 L 495 116" stroke="#7A94AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="120" width="290" height="212" rx="12" fill="#FAECE7" stroke="#C9D6E5" stroke-width="1"/>
  <text x="185" y="142" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">五类异常出口</text>

  <rect x="56" y="152" width="258" height="28" rx="6" fill="#FFFFFF"/>
  <text x="68" y="171" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937">审批不是待处理状态</text>
  <rect x="56" y="186" width="258" height="28" rx="6" fill="#FFFFFF"/>
  <text x="68" y="205" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937">R3 而审批人不是所有者</text>
  <rect x="56" y="220" width="258" height="28" rx="6" fill="#FFFFFF"/>
  <text x="68" y="239" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937">任务或运行不存在、不属于本工作区</text>
  <rect x="56" y="254" width="258" height="28" rx="6" fill="#FFFFFF"/>
  <text x="68" y="273" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937">已过有效期，三者一并置为终态</text>
  <rect x="56" y="288" width="258" height="28" rx="6" fill="#FFFFFF"/>
  <text x="68" y="307" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#1F2937">对象已不再等待审核或已被请求取消</text>

  <rect x="350" y="120" width="290" height="212" rx="12" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <text x="495" y="142" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">两类正常出口</text>

  <rect x="366" y="152" width="258" height="72" rx="8" fill="#FDEBD0" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="378" y="162" width="234" height="52" rx="6" fill="#FFFFFF"/>
  <text x="390" y="182" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">拒绝</text>
  <text x="390" y="200" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">任务取消，运行置为已拒绝并记录原因</text>
  <text x="390" y="214" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">返回空值，不再产生任何待投递消息</text>

  <rect x="366" y="236" width="258" height="72" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="378" y="246" width="234" height="52" rx="6" fill="#FFFFFF"/>
  <text x="390" y="266" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937">通过</text>
  <text x="390" y="284" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">任务回到排队，运行进入恢复排队</text>
  <text x="390" y="298" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">返回一条新的待投递消息，交由队列恢复</text>

  <text x="340" y="358" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">只有「通过」这一种出口会产生新的消息记录</text>
</svg>
