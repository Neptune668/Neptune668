<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" width="680" height="268">
  <rect x="0" y="0" width="680" height="268" fill="#FFFFFF"/>

  <!-- 待签字符串 -->
  <rect x="15" y="20" width="650" height="52" rx="8" fill="#FAEDA8" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="29" y="30" width="622" height="32" rx="6" fill="#FFFFFF"/>
  <text x="39" y="45" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">string_to_sign ＝ 算法标识 / X-Date / credential_scope / SHA256(canonical_request)</text>
  <text x="39" y="58" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">canonical_request 由方法、URI、查询串、规范头与载荷哈希拼成</text>

  <!-- 派生链 -->
  <rect x="15" y="120" width="100" height="72" rx="8" fill="#E6F1FB" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="25" y="130" width="80" height="52" rx="6" fill="#FFFFFF"/>
  <text x="33" y="150" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">Secret Key</text>
  <text x="33" y="166" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">原始密钥</text>
  <text x="33" y="178" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">不加前缀</text>

  <rect x="125" y="120" width="100" height="72" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="135" y="130" width="80" height="52" rx="6" fill="#FFFFFF"/>
  <text x="143" y="150" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">kDate</text>
  <text x="143" y="166" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">HMAC 日期</text>
  <text x="143" y="178" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">20261029</text>

  <rect x="235" y="120" width="100" height="72" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="245" y="130" width="80" height="52" rx="6" fill="#FFFFFF"/>
  <text x="253" y="150" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">kRegion</text>
  <text x="253" y="166" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">HMAC 区域</text>
  <text x="253" y="178" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">cn-north-1</text>

  <rect x="345" y="120" width="100" height="72" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="355" y="130" width="80" height="52" rx="6" fill="#FFFFFF"/>
  <text x="363" y="150" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">kService</text>
  <text x="363" y="166" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">HMAC 服务</text>
  <text x="363" y="178" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">cv</text>

  <rect x="455" y="120" width="100" height="72" rx="8" fill="#EEEDFE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="465" y="130" width="80" height="52" rx="6" fill="#FFFFFF"/>
  <text x="473" y="150" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">kRequest</text>
  <text x="473" y="166" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">HMAC 标识</text>
  <text x="473" y="178" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">request</text>

  <rect x="565" y="120" width="100" height="72" rx="8" fill="#EAF3DE" stroke="#C9D6E5" stroke-width="1"/>
  <rect x="575" y="130" width="80" height="52" rx="6" fill="#FFFFFF"/>
  <text x="583" y="150" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1F2937">Signature</text>
  <text x="583" y="166" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">十六进制串</text>
  <text x="583" y="178" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5A7A99">写入请求头</text>

  <!-- 横向箭头 -->
  <path d="M 115 156 L 121 156" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="125,156 119,152 119,160" fill="#7A94AD"/>
  <path d="M 225 156 L 231 156" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="235,156 229,152 229,160" fill="#7A94AD"/>
  <path d="M 335 156 L 341 156" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="345,156 339,152 339,160" fill="#7A94AD"/>
  <path d="M 445 156 L 451 156" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="455,156 449,152 449,160" fill="#7A94AD"/>
  <path d="M 555 156 L 561 156" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="565,156 559,152 559,160" fill="#7A94AD"/>

  <!-- string_to_sign 指向 Signature -->
  <path d="M 615 72 L 615 116" stroke="#7A94AD" stroke-width="1.5" fill="none"/>
  <polygon points="615,120 611,113 619,113" fill="#7A94AD"/>

  <text x="15" y="224" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">第一轮 HMAC 直接使用原始 Secret Key，之后依次派生日期、区域、服务和 request 密钥，中间任何一步加前缀或改顺序都会导致签名校验失败。</text>
  <text x="15" y="242" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">凭证作用域 credential_scope ＝ short_date / region / service / request，与派生链四个 key 一一对应。</text>
</svg>
